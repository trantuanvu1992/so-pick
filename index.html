<link rel="stylesheet" id="iconFont" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&icon_names=add,add_card,add_circle,auto_awesome,balance,bolt,calculate,calendar_month,campaign,casino,celebration,chair,check,check_circle,chevron_left,chevron_right,close,content_copy,delete,deselect,difference,done,done_all,edit,edit_note,egg,emoji_events,event_available,event_repeat,expand_less,fact_check,favorite,fitness_center,grid_view,handshake,history,hourglass_top,how_to_reg,image,ios_share,key_off,leaderboard,local_fire_department,lock,lock_open,manage_accounts,menu_book,military_tech,monitor_heart,north_east,payments,percent,person,person_remove,person_search,qr_code_2,radio_button_unchecked,receipt_long,redeem,refresh,remove_circle,restart_alt,save,savings,schedule,science,search,select_all,shuffle,south_west,sports_kabaddi,sports_tennis,star,swords,task_alt,trending_up,tune,undo,verified,view_agenda,view_list,volunteer_activism,warning,whatshot,wifi_off,workspace_premium&display=block" media="print" onload="this.media='all'">
<style>
/* Layout: one-column phone app (top bar, scrolling glass cards, M3 navigation bar); widens to a 2-column match grid on desktop. */
:root{
  --bg:#E6F1F0; --fg:#0E1C1D; --muted:#4F6466; --hair:rgba(14,40,42,.11);
  --primary:#00696C; --on-primary:#FFFFFF; --primary-c:#BDEDEA; --on-primary-c:#002122;
  --ball:#DCF24E; --on-ball:#1B2300;
  --glass:rgba(255,255,255,.56); --glass-hi:rgba(255,255,255,.86); --glass-line:rgba(255,255,255,.8);
  --shadow:0 1px 2px rgba(10,40,42,.06),0 8px 28px -10px rgba(10,60,62,.22);
  --win:#17784A; --win-c:#CFF3DC; --lose:#B3261E; --lose-c:#FFDAD5; --warn:#8A5A00;
  --blob1:#5FD0C8; --blob2:#E2F36A; --blob3:#8DB7FF;
  --scrim:rgba(8,24,26,.38);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-xl:28px; --r-l:20px; --r-m:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081315; --fg:#E1EEED; --muted:#93AAAB; --hair:rgba(255,255,255,.08);
  --primary:#62DAD6; --on-primary:#003739; --primary-c:#11494B; --on-primary-c:#BCF4F1;
  --ball:#CFEA3A; --on-ball:#1A2200;
  --glass:rgba(22,40,42,.52); --glass-hi:rgba(26,44,46,.92); --glass-line:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  --win:#74DFA4; --win-c:#0F3D25; --lose:#FFB4AB; --lose-c:#5C1611; --warn:#F2C068;
  --blob1:#0E5C5A; --blob2:#4D5A0D; --blob3:#1E3A6E; --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081315; --fg:#E1EEED; --muted:#93AAAB; --hair:rgba(255,255,255,.08);
  --primary:#62DAD6; --on-primary:#003739; --primary-c:#11494B; --on-primary-c:#BCF4F1;
  --ball:#CFEA3A; --on-ball:#1A2200;
  --glass:rgba(22,40,42,.52); --glass-hi:rgba(26,44,46,.92); --glass-line:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  --win:#74DFA4; --win-c:#0F3D25; --lose:#FFB4AB; --lose-c:#5C1611; --warn:#F2C068;
  --blob1:#0E5C5A; --blob2:#4D5A0D; --blob3:#1E3A6E; --scrim:rgba(0,0,0,.55); color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-ui);font-variant-numeric:tabular-nums;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.ms{width:1em;overflow:hidden;font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 500,"opsz" 24;user-select:none;flex:none}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 500,"opsz" 24}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ambient court background */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;opacity:.75}
/* vệt màu nền dùng gradient (không dùng filter blur → cuộn/bấm mượt hơn trên điện thoại) */
.bgfx i:nth-child(1){width:70vmax;height:70vmax;left:-30vmax;top:-25vmax;background:radial-gradient(closest-side,var(--blob1),transparent)}
.bgfx i:nth-child(2){width:55vmax;height:55vmax;right:-22vmax;top:18vh;background:radial-gradient(closest-side,var(--blob2),transparent);opacity:.6}
.bgfx i:nth-child(3){width:60vmax;height:60vmax;left:-15vmax;bottom:-35vmax;background:radial-gradient(closest-side,var(--blob3),transparent);opacity:.5}
.bgfx svg{position:absolute;inset:0;width:100%;height:100%;opacity:.5}

.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1px solid var(--glass-line);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.35)}

/* top app bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 62%,transparent);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand b{font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ballmark{width:30px;height:30px;flex:none}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.icon-btn:hover{background:var(--hair)}
.loadbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:40;overflow:hidden;opacity:0;transition:opacity .2s}
.loadbar.on{opacity:1}
.loadbar::after{content:"";position:absolute;inset:0;width:40%;background:var(--primary);border-radius:3px;animation:lb 1s infinite ease-in-out}
@keyframes lb{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

main{max-width:980px;margin:0 auto;padding-block:4px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.demo-banner{font-size:12.5px;color:var(--on-primary-c);background:var(--primary-c);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center}

/* hero */
.hero{border-radius:var(--r-xl);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hero-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px;text-wrap:balance}
h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 4px 0}
.sub{color:var(--muted);font-size:13.5px}
.status{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.status.MO{background:#CDEFD0;color:#14532D}
.status.CHOT{background:#FBE1E1;color:#9B2C2C}
.status.LIVE{background:#FFE36E;color:#4A3B00;box-shadow:0 0 0 2px #FFD23F inset}
.status.PAST{background:#FFE2C2;color:#7A3E00}
.progress{height:8px;border-radius:99px;background:var(--hair);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),color-mix(in srgb,var(--primary) 60%,var(--ball)))}
.hero-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:13px;color:var(--muted)}
.hero-meta b{color:var(--fg)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{height:40px;padding:0 16px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap}
.btn .ms{font-size:19px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--primary-c);color:var(--on-primary-c)}
.btn.outline{border:1px solid color-mix(in srgb,var(--fg) 22%,transparent)}
.btn.text{color:var(--primary);padding:0 10px}
.btn.danger{color:var(--lose)}
.btn.big{height:52px;font-size:16px;flex:1}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:34px;padding:0 12px;font-size:13px}

/* search */
.search{border-radius:99px;display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;height:54px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;height:100%}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--fg) 16%,transparent);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;white-space:nowrap;background:color-mix(in srgb,var(--glass-hi) 50%,transparent)}
.chip.on{background:var(--primary-c);color:var(--on-primary-c);border-color:transparent}
.chip .ms{font-size:18px}
.chip.me{border-color:var(--primary)}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px}

/* person strip when searching */
.pstrip{border-radius:var(--r-l);padding:12px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pstrip .avatar{width:40px;height:40px}
.kv{display:flex;flex-direction:column}
.kv small{font-size:11.5px;color:var(--muted);font-weight:600}
.kv b{font-size:17px}

/* match cards */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.sec-title{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:4px}
.match{border-radius:var(--r-l);padding:12px 14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;position:relative;transition:transform .12s}
.match:active{transform:scale(.985)}
.match.next{outline:2px solid var(--ball);outline-offset:-2px}
.m-head{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.m-no{font-weight:800;color:var(--fg);font-size:14px}
.m-head .sp{flex:1}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--hair);color:var(--muted)}
.tag.next{background:var(--ball);color:var(--on-ball)}
.tag.todo{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.m-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:15.5px;min-width:0;line-height:1.25;padding:6px 8px;border-radius:12px}
.team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.b{text-align:right}
.team.win{background:var(--win-c);color:var(--win)}
.team.lose{color:color-mix(in srgb,var(--fg) 62%,transparent)}
.team mark{background:var(--ball);color:var(--on-ball);border-radius:4px;padding:0 3px}
.score{font-weight:800;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:4px;min-width:62px;justify-content:center}
.score .dash{color:var(--muted);font-weight:500}
.score.vs{font-size:13px;color:var(--muted);font-weight:700;width:44px;height:44px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--fg) 25%,transparent);min-width:0}
.m-foot{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.m-foot .ms{font-size:15px;vertical-align:-3px}

/* summary list */
.board{border-radius:var(--r-xl);padding:6px;display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:28px 40px 1fr auto;align-items:center;gap:10px;padding:10px;border-radius:16px}
.prow + .prow{border-top:1px solid var(--hair)}
.prow.me{background:color-mix(in srgb,var(--primary) 9%,transparent)}
.rank{font-weight:800;color:var(--muted);text-align:center}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0E1C1D;flex:none}
.pname{font-weight:700;min-width:0}
.pname small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.owe{font-weight:800;font-size:15px;padding:6px 10px;border-radius:10px;background:var(--lose-c);color:var(--lose);white-space:nowrap}
.owe.zero{background:var(--win-c);color:var(--win)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border-radius:var(--r-l);padding:14px}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pos{color:var(--win)} .neg{color:var(--lose)}

/* fund */
.fund-hero{border-radius:var(--r-xl);padding:20px 18px;display:flex;flex-direction:column;gap:6px}
.fund-hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.lrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;text-align:left;width:100%}
.lrow + .lrow{border-top:1px solid var(--hair)}
.licon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.licon.in{background:var(--win-c);color:var(--win)}
.licon.out{background:var(--lose-c);color:var(--lose)}
.licon.wait{background:color-mix(in srgb,var(--ball) 55%,transparent);color:var(--on-ball)}
.lamt{font-weight:800;white-space:nowrap}
.panel{border-radius:var(--r-xl);padding:6px}
.empty{border-radius:var(--r-xl);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .ms{font-size:44px;color:var(--primary)}

.srow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r-l);text-align:left;width:100%}
.datebox{width:52px;height:56px;border-radius:14px;background:var(--primary-c);color:var(--on-primary-c);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.datebox small{font-size:11px;font-weight:700}
.datebox b{font-size:20px;font-weight:800}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-xl)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
tbody tr{border-top:1px solid var(--hair)}

/* nav bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-top:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.nav-inner{pointer-events:auto;display:flex;gap:2px;border-radius:30px;padding:6px;width:100%;max-width:460px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 0}
.nav .pill{width:58px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.nav button.on{color:var(--fg)}
.nav button.on .pill{background:var(--primary-c);color:var(--on-primary-c)}
.nav button.on .ms{font-variation-settings:"FILL" 1,"wght" 600,"opsz" 24}
.fab{position:fixed;z-index:19;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 94px);height:56px;border-radius:18px;padding:0 20px 0 16px;display:flex;align-items:center;gap:8px;background:var(--ball);color:var(--on-ball);font-weight:700;box-shadow:0 8px 24px -6px rgba(40,60,0,.45)}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;margin:0 auto;max-width:620px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:var(--glass-hi);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--glass-line);border-bottom:0;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet-body > *{flex-shrink:0}
.sheet .grab{width:36px;height:4px;border-radius:4px;background:color-mix(in srgb,var(--fg) 30%,transparent);margin:10px auto 2px;flex:none}
.sheet-body{overflow-y:auto;padding-block:8px calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{height:48px;border-radius:12px;border:1px solid color-mix(in srgb,var(--fg) 20%,transparent);background:color-mix(in srgb,var(--bg) 55%,transparent);padding:0 12px;font-size:16px;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--primary);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:38px;padding:0 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--fg) 18%,transparent);font-weight:600;font-size:14px}
.seg button.on{background:var(--primary);color:var(--on-primary);border-color:transparent}
.calc{border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--primary) 10%,transparent);font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.calc b{font-weight:800}
.hint{font-size:13.5px;border-radius:12px;padding:10px 12px;background:var(--hair)}
.hint.ok{background:var(--win-c);color:var(--win)}
.hint.bad{background:var(--lose-c);color:var(--lose)}
.hint.warn{background:color-mix(in srgb,var(--ball) 45%,transparent);color:var(--on-ball)}
.actions{display:flex;gap:10px;position:sticky;bottom:0}

/* score entry */
.sc-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border-radius:18px;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.sc-row.win{background:var(--win-c)}
.sc-team{font-weight:800;font-size:17px;line-height:1.25;min-width:0}

<script>
/* ====================== THUẬT TOÁN XẾP LỊCH (ALG) ====================== */
/*ALG-START*/
/**
 * Xếp lịch đánh đôi xoay vòng công bằng.
 * Mỗi vòng: chọn 4k người ít trận nhất (ưu tiên người vừa ngồi nghỉ), rồi chia cặp sao cho
 * cặp đôi (partner) và đối thủ (opponent) lặp lại ít nhất. Chạy lại nhiều lần ngẫu nhiên, giữ lịch có điểm phạt thấp nhất.
 * history = các trận đã đánh (giữ nguyên) khi xếp lại giữa buổi.
 */
function makeStats(players){
  const n=players.length, idx={};
  players.forEach((p,i)=>idx[p]=i);
  const z=()=>Array.from({length:n},()=>new Array(n).fill(0));
  return {n,idx,games:new Array(n).fill(0),rest:new Array(n).fill(0),part:z(),opp:z()};
}
function applyMatch(st,m){
  const A=m.a.map(p=>st.idx[p]), B=m.b.map(p=>st.idx[p]);
  [...A,...B].forEach(i=>{ if(i!==undefined) st.games[i]++; });
  const pair=(x,y,t)=>{ if(x!==undefined&&y!==undefined){ t[x][y]++; t[y][x]++; } };
  pair(A[0],A[1],st.part); pair(B[0],B[1],st.part);
  A.forEach(a=>B.forEach(b=>pair(a,b,st.opp)));
}
const W_PART=10, W_OPP=2;
/** Trận các buổi trước (trong tháng): chỉ cộng số lần đã CẶP / đã GẶP, không cộng số trận (số trận bù riêng bằng carry). */
function applyPrior(st,m){
  const A=m.a.map(p=>st.idx[p]), B=m.b.map(p=>st.idx[p]);
  const pair=(x,y,t)=>{ if(x!==undefined&&y!==undefined){ t[x][y]++; t[y][x]++; } };
  pair(A[0],A[1],st.part); pair(B[0],B[1],st.part); A.forEach(a=>B.forEach(b=>pair(a,b,st.opp)));
}
function quadCost(st,q){ // q = 4 index; trả về [cost, cách chia tốt nhất]
  const opts=[[q[0],q[1],q[2],q[3]],[q[0],q[2],q[1],q[3]],[q[0],q[3],q[1],q[2]]];
  let best=null,bc=Infinity;
  for(const o of opts){
    const c = W_PART*(st.part[o[0]][o[1]]**2 + st.part[o[2]][o[3]]**2)
            + W_OPP*(st.opp[o[0]][o[2]]+st.opp[o[0]][o[3]]+st.opp[o[1]][o[2]]+st.opp[o[1]][o[3]])
            + Math.random()*0.5;
    if(c<bc){bc=c;best=o;}
  }
  return [bc,best];
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function splitGroup(st,sel,k){
  if(k===1) return [quadCost(st,sel)[1]];
  let best=null,bc=Infinity;
  const tries=k===2?60:120;
  for(let t=0;t<tries;t++){
    const s=shuffle(sel.slice()); let c=0; const g=[];
    for(let i=0;i<k;i++){ const [qc,o]=quadCost(st,s.slice(i*4,i*4+4)); c+=qc; g.push(o); }
    if(c<bc){bc=c;best=g;}
  }
  return best;
}
/** Đơn: chia 2k người thành k cặp đấu, tránh gặp lại đối thủ cũ. */
function splitSingles(st,sel,k){
  let best=null,bc=Infinity;
  for(let t=0;t<(k===1?1:60);t++){ const s=k===1?sel.slice():shuffle(sel.slice()); let c=0; const g=[];
    for(let i=0;i<k;i++){ const x=s[2*i],y=s[2*i+1]; c+=st.opp[x][y]**2*W_PART; g.push([x,y]); }
    if(c<bc){bc=c;best=g;} }
  return best;
}
/** Đôi nam-nữ: mỗi đội 1 nam + 1 nữ. M, F = chỉ số người đã chọn (2k mỗi bên). */
function splitMixed(st,M,F,k){
  let best=null,bc=Infinity;
  for(let t=0;t<120;t++){ const m=shuffle(M.slice()), f=shuffle(F.slice()); let c=0; const g=[];
    for(let i=0;i<k;i++){ const a0=m[2*i],a1=f[2*i],b0=m[2*i+1],b1=f[2*i+1];
      c+=W_PART*(st.part[a0][a1]**2+st.part[b0][b1]**2)+W_OPP*(st.opp[a0][b0]+st.opp[a0][b1]+st.opp[a1][b0]+st.opp[a1][b1]); g.push([a0,a1,b0,b1]); }
    if(c<bc){bc=c;best=g;} }
  return best;
}
/** Số sân tối đa chạy cùng lúc theo thể loại. type: DN đôi (mặc định) · DON đơn · MIX đôi nam-nữ (nF = số nữ). */
function capOf(n,type,nF){ if(type==='DON') return Math.floor(n/2); if(type==='MIX') return Math.min(Math.floor((n-(nF||0))/2),Math.floor((nF||0)/2)); return Math.floor(n/4); }
const TYPE_NAME={DN:'Đôi nam',DON:'Đơn nam',MIX:'Đôi nam-nữ'}, TYPE_SHORT={DN:'Đôi',DON:'Đơn',MIX:'Mix'};
/**
 * opt.type  = DN | DON | MIX ; opt.female = Set tên nữ (MIX)
 * opt.prio  = [tên…] thứ tự ưu tiên: người số 1 đánh trước nhất, đủ số trận thì nghỉ (về sớm)
 * opt.target= số trận mỗi người (để biết người ưu tiên đã "đủ")
 */
function buildOnce(players,plan,history,startRound,opt){
  opt=opt||{}; const type=opt.type||'DN', per=type==='DON'?2:4;
  const st=makeStats(players);
  (opt.prior||[]).forEach(m=>applyPrior(st,m)); // xoay cặp theo cả tháng: ai đã cặp/gặp nhau buổi trước thì buổi này ưu tiên người khác
  history.forEach(m=>applyMatch(st,m));
  if(history.length){ // ai không đánh vòng cuối của lịch cũ => coi như vừa nghỉ
    const lastR=Math.max(...history.map(m=>m.round));

    players.forEach((p,i)=>st.rest[i]=inLast.has(p)?0:1);

    const order=players.map((p,i)=>({i,key:key(i)})).filter(o=>!(prio[o.i]&&target&&st.games[o.i]>=target)).sort((x,y)=>x.key-y.key);

    if(type==='MIX'){ const M=order.filter(o=>!fem.has(players[o.i])), F=order.filter(o=>fem.has(players[o.i]));

function scoreSchedule(players,all,opt){
  const st=makeStats(players); ((opt&&opt.prior)||[]).forEach(m=>applyPrior(st,m)); all.forEach(m=>applyMatch(st,m));
  const g=st.games; let s=(Math.max(...g)-Math.min(...g))*1000;
  // bù trận các buổi trước: buổi này lẻ trận thì người đã đánh dư nhận ít hơn (tổng cộng dồn càng đều càng tốt)
  if(opt&&opt.carry){ const T=players.map((p,i)=>g[i]+(opt.carry[p]||0)), mu=T.reduce((a,b)=>a+b,0)/T.length; s+=T.reduce((a,t)=>a+(t-mu)**2,0)*300; }
  for(let i=0;i<st.n;i++) for(let j=i+1;j<st.n;j++){ s+=W_PART*st.part[i][j]**2 + st.opp[i][j]**2; }
  // phạt ngồi nghỉ 2 vòng liên tiếp (người ưu tiên đã đủ trận thì về sớm, không phạt)
  const done=new Set((opt&&opt.prio)||[]);
  const rounds={}; all.forEach(m=>{(rounds[m.round]=rounds[m.round]||new Set()); [...m.a,...m.b].forEach(p=>rounds[m.round].add(p));});
  const rk=Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  players.forEach(p=>{ if(done.has(p)) return; let run=0; rk.forEach(r=>{ if(rounds[r].has(p)) run=0; else { run++; if(run>=2) s+=40; } }); });

}
/** roundsOrPlan: số vòng (mọi sân như nhau) hoặc plan = [[sân mở ở vòng 1], [vòng 2]…] khi mỗi sân có giờ riêng.
 *  opt: {type, female, prio, late} – late=true: người có số ưu tiên đánh SAU (đến trễ). */
function generateSchedule(players,roundsOrPlan,courts,history,startRound,iters,opt){
  history=history||[]; startRound=startRound||1; opt=opt||{};
  const type=opt.type||'DN', per=type==='DON'?2:4;
  const nF=type==='MIX'?players.filter(p=>(opt.female||new Set()).has(p)).length:0;
  const maxK=capOf(players.length,type,nF);
  let plan=Array.isArray(roundsOrPlan)?roundsOrPlan:Array.from({length:roundsOrPlan},()=>Array.from({length:courts},(_,i)=>i+1));
  plan=plan.map(cs=>cs.slice(0,maxK));
  if(maxK<1||!plan.some(cs=>cs.length)) return {matches:[],k:0};
  // số trận/người dự kiến (cả trận đã đánh) → người ưu tiên đánh dồn cho đủ rồi nghỉ
  const slots=plan.reduce((t,cs)=>t+cs.length,0)*per+history.reduce((t,m)=>t+[...m.a,...m.b].filter(p=>players.includes(p)).length,0);
  const o2={...opt,type,target:opt.prio&&opt.prio.length?Math.max(1,Math.floor(slots/players.length)):0};
  const L=plan.length, src=opt.late?plan.slice().reverse():plan; // đến trễ = xếp ngược từ cuối buổi
  iters=iters||Math.max(150,Math.min(500,Math.round(6000/plan.length)));

  for(let t=0;t<iters;t++){
    let res=buildOnce(players,src,opt.late?[]:history,startRound,o2);
    if(opt.late){ res.forEach(m=>m.round=startRound+(L-1-(m.round-startRound))); res.sort((a,b)=>a.round-b.round||a.court-b.court);
      // tính lại người nghỉ theo đúng thứ tự giờ
      const byR={}; res.forEach(m=>{ const x=byR[m.round]||(byR[m.round]=new Set()); [...m.a,...m.b].forEach(p=>p&&x.add(p)); });
      res.forEach(m=>m.rest=players.filter(p=>!byR[m.round].has(p))); }
    const sc=scoreSchedule(players,history.concat(res),o2);
    if(sc<bs){bs=sc;best=res;}
  }
  return {matches:best,k:Math.max(...plan.map(cs=>cs.length)),score:bs};
}
const hm2m=t=>{const [h,m]=String(t||'0:0').split(':').map(Number);return h*60+(m||0);};
const m2hm=v=>`${String(Math.floor(v/60)%24).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`;
/** Giờ riêng từng sân → plan các vòng. times=[{start:'17:30',end:'19:30'},…] */
function buildPlan(times,minPer){
  const T=times.map(t=>({s:hm2m(t.start),e:hm2m(t.end)})).filter(t=>t.e>t.s);
  if(!T.length) return {plan:[],start:'18:00',duration:0};
  const s0=Math.min(...T.map(t=>t.s)), e1=Math.max(...T.map(t=>t.e)), R=Math.floor((e1-s0)/minPer);
  const plan=[];
  for(let r=0;r<R;r++){const slot=s0+r*minPer; plan.push(times.map((t,i)=>i+1).filter(i=>{const x=T[i-1];return x&&x.s<=slot&&slot+minPer<=x.e;}));}
  while(plan.length&&!plan[plan.length-1].length) plan.pop();
  return {plan,start:m2hm(s0),duration:e1-s0};
}
/** Dành lượt-sân cho nhóm đánh vui (không xếp cặp). rows=[{round,courts}], n=số người xếp lịch, K=số lượt-sân dành thêm, ex=có người đánh vui.
 *  Sân thừa vì thiếu người (n<4×số sân) tự thành sân đánh vui. Lượt dành được rải đều theo giờ, lấy sân cuối của lượt. */
function reserveFree(rows,maxK,K,ex){
  const free=[];
  const out=rows.map(x=>{ if(ex) x.courts.slice(maxK).forEach(c=>free.push([x.round,c])); return {round:x.round,courts:x.courts.slice(0,maxK)}; });
  let need=ex?Math.max(0,K|0):0;
  while(need>0){
    const cand=out.filter(x=>x.courts.length), L=cand.length; if(!L) break;
    const take=Math.min(need,L);
    for(let i=0;i<take;i++){ const x=cand[Math.floor((i+0.5)*L/take)]; free.push([x.round,x.courts.pop()]); }
    need-=take;
  }
  free.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  return {rows:out,free};
}
/** Gợi ý số lượt-sân dành đánh vui để mọi người (cả nhóm đánh vui) có thời gian sân gần bằng nhau. */
function suggestFree(rows,maxK,n,e){
  if(!e) return 0;
  const all=rows.reduce((t,x)=>t+x.courts.length,0), usable=rows.reduce((t,x)=>t+Math.min(x.courts.length,maxK),0);
  return Math.max(0,Math.min(usable-1,Math.ceil(e*all/(n+e))-(all-usable)));
}
/** Phân tích độ công bằng: số trận/người, số lần lặp partner, điểm dừng mà mọi người bằng trận. */
function analyzeSchedule(players,matches){
  const st=makeStats(players); let evenAt=0, evenGames=0;
  matches.forEach((m,i)=>{ applyMatch(st,m);
    const g=st.games; if(Math.min(...g)===Math.max(...g)&&g[0]>0){evenAt=i+1;evenGames=g[0];} });
  let maxPart=0, pairsUsed=0;
  for(let i=0;i<st.n;i++) for(let j=i+1;j<st.n;j++){ maxPart=Math.max(maxPart,st.part[i][j]); if(st.part[i][j]) pairsUsed++; }
  return {games:Object.fromEntries(players.map((p,i)=>[p,st.games[i]])),min:Math.min(...st.games),max:Math.max(...st.games),maxPart,pairsUsed,pairsTotal:st.n*(st.n-1)/2,evenAt,evenGames};
}

function computeShares(players,base,rules,round){
  rules=rules||{};round=round||1000;const out={};let fixed=0;const eq=[];
  players.forEach(p=>{const r=rules[p]||{mode:'eq'};
    if(r.mode==='free')out[p]=0; else if(r.mode==='fund'){out[p]=0;eq.push(p);} else if(r.mode==='fixed'){out[p]=Math.max(0,+r.amount||0);fixed+=out[p];} else eq.push(p);});

  eq.forEach(p=>{if((rules[p]||{}).mode!=='fund')out[p]=per;});
  return {shares:out,per};
}

/** Chuỗi VietQR (EMVCo). amount=0 → người chuyển tự nhập số tiền. */
function vietQR(amount,info){

  const f=(id,v)=>id+String(v.length).padStart(2,'0')+v, asc=t=>fold(t).toUpperCase().replace(/[^A-Z0-9 ]/g,'').slice(0,25);

  return p+crc16(p);
}

function fundOf(ledger,excludeSid){
  let paidIn=0,pend=0,out=0;
  ledger.forEach(l=>{ if(excludeSid&&l.sessionId===excludeSid) return;
    if(l.type==='CHI') out+=l.amount; else if(l.status==='CHUA_DONG') pend+=l.amount; else paidIn+=l.amount; });
  return {paidIn,pend,out,balance:paidIn-out,expected:paidIn+pend-out};
}
/**
 * Tách 2 túi tiền:
 *  - CHỦ HỘI ỨNG (O): tiền sân/nước/chi buổi chủ hội trả trước + nợ cũ trước khi mở sổ, trừ phần mọi người đã trả lại (chia sân/nước, nợ đầu kỳ)
 *    và phần quỹ tháng trả thay TV tháng (khi buổi đã chốt).
 *  - QUỸ HỘI (F): tiền thua, quỹ tháng, dư làm tròn, thu/chi khác… = tiền sổ (N) + O − tiền gửi trước đang giữ hộ.
 */
function fundSplit(L){
  L=L||S.boot.ledger; const ss={}; (S.boot.sessions||[]).forEach(x=>ss[x.id]=x);
  const f=fundOf(L), by={}, done=l=>l.status!=='CHUA_DONG';
  L.forEach(l=>{ if(!ss[l.sessionId]) return; const g=by[l.sessionId]||(by[l.sessionId]={cost:0,paid:0,all:0});
    if(l.type==='CHI') g.cost+=l.amount; else if(l.category==='Chia sân/nước'){ g.all+=l.amount; if(done(l)) g.paid+=l.amount; } });
  let O=0,Oexp=0,fundPay=0,surplus=0,surplusExp=0; const srcs=[];
  Object.entries(by).forEach(([sid,g])=>{ const x=ss[sid], quyTra=x.share&&x.share.enabled===false&&!isAutoThang(x)&&!isTrial(x);
    const fp=quyTra?g.cost:(x.status==='CHOT'||isAutoThang(x))&&!isTrial(x)?((shareInfo(x)||{}).fund||0):0; fundPay+=fp; // tắt chia tiền = quỹ hội trả toàn bộ tiền sân (sân tháng)
    const rem=Math.max(0,g.cost-g.paid-fp), remExp=Math.max(0,g.cost-g.all-fp);
    O+=rem; Oexp+=remExp; surplus+=Math.max(0,g.paid+fp-g.cost); surplusExp+=Math.max(0,g.all+fp-g.cost);
    if(g.cost) srcs.push({sid,date:x.date,closed:x.status==='CHOT',quyTra,cost:g.cost,back:Math.min(g.cost,g.paid+fp),rem,remExp}); });
  const sum=fn=>L.filter(fn).reduce((t,l)=>t+l.amount,0);
  const adv=sum(l=>l.sessionId==='DK'&&l.type==='CHI'&&l.category==='Chủ hội ứng');
  const dkRem=Math.max(0,adv-sum(l=>l.sessionId==='DK'&&l.category==='Nợ đầu kỳ'&&done(l))), dkRemExp=Math.max(0,adv-sum(l=>l.sessionId==='DK'&&l.category==='Nợ đầu kỳ'));
  O+=dkRem; Oexp+=dkRemExp; if(adv) srcs.push({dk:true,date:'',cost:adv,back:adv-dkRem,rem:dkRem,remExp:dkRemExp,closed:true});
  srcs.sort((a,b)=>(a.dk?-1:0)-(b.dk?-1:0)||a.date.localeCompare(b.date));
  const dep=Object.values(creditsOf(L)).reduce((a,b)=>a+Math.max(0,b),0);
  const F=f.balance+O-dep, Fexp=f.expected+Oexp-dep;
  const parts={fines:sum(l=>l.type==='THU'&&l.category==='Tiền thua'&&done(l)),monthly:sum(l=>l.type==='THU'&&l.category==='Quỹ tháng'&&done(l)),surplus,fundPay};
  parts.other=F-(parts.fines+parts.monthly+surplus-fundPay);
  // quỹ hội âm = quỹ chưa đủ tiền trả sân → phần âm đó cũng là chủ hội đang ứng thay quỹ
  return {N:f.balance,O,Oexp,F,Fexp,dep,parts,srcs,pend:f.pend,OT:O+Math.max(0,-F),OTexp:Oexp+Math.max(0,-Fexp)};
}

/** Số trận dư(+)/thiếu(−) của từng người so với trung bình mỗi buổi, cộng dồn các buổi trước trong cùng tháng (trận xếp hạng có tỷ số).
 *  Dùng để buổi sau bù lại: ai đã đánh dư thì nếu lẻ trận sẽ được xếp ít hơn. */
function carryFor(players,date,excludeSid){
  if(!S.allMatches) return null;
  const m=String(date).slice(0,7), out={};
  S.boot.sessions.filter(x=>x.id!==excludeSid&&!isTrial(x)&&x.date.slice(0,7)===m&&x.date<=date).forEach(x=>{
    const ms=S.allMatches.filter(r=>r[0]===x.id&&r[9]!=='GL'); if(!ms.length) return;
    const g={}; x.players.forEach(p=>g[p]=0); ms.forEach(r=>[r[1],r[2],r[3],r[4]].filter(Boolean).forEach(p=>g[p]=(g[p]||0)+1));
    const ps=Object.keys(g), mu=ps.reduce((a,p)=>a+g[p],0)/ps.length;
    ps.forEach(p=>out[p]=(out[p]||0)+g[p]-mu);
  });
  const r={}; players.forEach(p=>{ if(Math.abs(out[p]||0)>=0.05) r[p]=Math.round(out[p]*100)/100; });
  return r;
}

function pairCover(players,ms){
  const P=new Set(players), seen=new Set(); ms.forEach(m=>[m.a,m.b].forEach(t=>{ if(t[0]&&t[1]&&P.has(t[0])&&P.has(t[1])) seen.add([t[0],t[1]].sort().join('|')); }));

/**
 * XOAY TOUR theo lịch sử: các trận có tỷ số của những buổi trước (cùng loại buổi, hoặc mọi buổi) trong CHU KỲ hiện tại.
 * Chu kỳ: đánh tới khi mọi cặp đồng đội trong nhóm người này đều đã đánh cùng nhau (đơn: mọi người đều đã gặp nhau) → bắt đầu vòng mới.
 * Trả về: prior (trận trong chu kỳ, cho thuật toán tránh lặp cặp/đối thủ), carry (dư/thiếu trận để bù), độ phủ cặp & đối thủ.
 */
function rotation(players,o){
  o=o||{}; if(!S.allMatches) return null;
  const ss={}; S.boot.sessions.forEach(x=>ss[x.id]=x);
  const P=new Set(players), single=o.single, key=(x,y)=>[x,y].sort().join('|');
  const ms=S.allMatches.filter(r=>{ const x=ss[r[0]]; return x&&x.id!==o.excludeSid&&!isTrial(x)&&(!o.date||x.date<=o.date)&&(o.scope!=='type'||sessType(x)===o.type); })
    .map(r=>({...amObj(r),date:ss[r[0]].date})).sort((a,b)=>(a.date+String(a.no).padStart(3,'0')).localeCompare(b.date+String(b.no).padStart(3,'0')));
  const keysOf=m=>{ const A=m.a.filter(Boolean),B=m.b.filter(Boolean),out=[];
    if(single){ A.forEach(x=>B.forEach(y=>{ if(P.has(x)&&P.has(y)) out.push(key(x,y)); })); }
    else [A,B].forEach(t=>{ if(t.length===2&&P.has(t[0])&&P.has(t[1])) out.push(key(t[0],t[1])); });
    return out; };
  const n=players.length, total=n*(n-1)/2;
  let seen=new Set(), start=0, cycles=0;
  ms.forEach((m,i)=>{ keysOf(m).forEach(k=>seen.add(k)); if(total&&seen.size>=total){ seen=new Set(); start=i+1; cycles++; } });
  const cur=ms.slice(start);

  const carry={}, bySid={}; cur.forEach(m=>(bySid[m.sid]=bySid[m.sid]||[]).push(m));
  Object.entries(bySid).forEach(([sid,arr])=>{ if(arr.every(m=>m.mode==='GL')) return;
    const g={}; (ss[sid].players||[]).forEach(p=>g[p]=0); arr.filter(m=>m.mode!=='GL').forEach(m=>[...m.a,...m.b].filter(Boolean).forEach(p=>g[p]=(g[p]||0)+1));
    const ps=Object.keys(g), mu=ps.reduce((a,p)=>a+g[p],0)/(ps.length||1); ps.forEach(p=>{ if(P.has(p)) carry[p]=(carry[p]||0)+g[p]-mu; }); });
  Object.keys(carry).forEach(p=>{ carry[p]=Math.round(carry[p]*100)/100; if(Math.abs(carry[p])<0.05) delete carry[p]; });
  const opp=new Set(); cur.forEach(m=>m.a.filter(Boolean).forEach(x=>m.b.filter(Boolean).forEach(y=>{ if(P.has(x)&&P.has(y)) opp.add(key(x,y)); })));
  const missing=[]; for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){ const k=key(players[i],players[j]); if(!seen.has(k)) missing.push(k); }
  return {prior:cur.map(m=>({a:m.a,b:m.b})),cur,carry,seen,total,opp,cycles,since:cur.length?cur[0].date:'',missing,count:cur.length};
}

/* ---------- danh sách trận: dạng gọn (1 dòng) / đầy đủ ---------- */
const courtName=(s,c)=>(s&&s.courtNames&&s.courtNames[c-1])||('Sân '+c);
const courtShort=(s,c)=>{const n=courtName(s,c),m=n.match(/(\d+)\s*$/);return n.length<=7?n:(m?'S'+m[1]:n.slice(0,6));};
const cc=c=>'c'+(((c||1)-1)%4+1);
function courtLegend(s){
  if(!s) return '';
  const many=s.courts>1, named=(s.courtNames||[]).some(Boolean);
  if(!many&&!named) return '';
  return `<div class="legend">${many?'<span class="sub">Màu sân:</span>':''}${Array.from({length:s.courts},(_,i)=>`<span class="cbadge ${many?cc(i+1):''}">${esc(courtName(s,i+1))}${s.courtTimes&&s.courtTimes[i]&&s.courtTimes.some(t=>t.end!==s.courtTimes[0].end||t.start!==s.courtTimes[0].start)?` ${s.courtTimes[i].start}–${s.courtTimes[i].end}`:''}</span>`).join('')}
    ${s.status==='MO'?`<button class="btn text sm" data-act="openCourts"><span class="ms">edit</span>Đặt tên sân</button>`:''}</div>`;
}
function matchCard(m,q,nextId,expanded){
  const s=S.session, done=!!m.win, mc=s.courts>1;
  const ta=done?(m.win==='A'?'win':'lose'):'', tb=done?(m.win==='B'?'win':'lose'):'';
  const tag=done?'':m.id===nextId?'<span class="tag next">Sắp tới</span>':'<span class="tag todo">Chưa nhập</span>';
  return `<div class="match glass ${mc?'tint '+cc(m.court):''} ${m.id===nextId?'next':''} ${expanded?'open':''}" data-act="score" data-id="${m.id}" role="button" tabindex="0">
    <div class="m-head"><span class="m-no">#${m.no}</span>${mc||s.courtNames?.length?`<span class="cbadge ${mc?cc(m.court):''}">${esc(courtName(s,m.court))}</span>`:''}<span>${roundTime(s,m)} · ${m.stage?STAGE_NAME[m.stage]:'Vòng '+m.round}</span>${mBadges(m,s,1)}<span class="sp"></span>${tag}
      ${expanded?`<button class="icon-btn collapse" data-act="collapse" aria-label="Thu gọn"><span class="ms">expand_less</span></button>`:''}</div>
    <div class="m-body">
      <div class="team ${ta}">${sideNames(m,'a').filter(Boolean).map(n=>`<span>${m.a[0]?nmTag(n,q):`<em class="ph">${esc(n)}</em>`}</span>`).join('')}</div>
      ${done?`<div class="score"><span>${m.sa}</span><span class="dash">–</span><span>${m.sb}</span></div>`:`<div class="score vs">VS</div>`}
      <div class="team b ${tb}">${sideNames(m,'b').filter(Boolean).map(n=>`<span>${m.b[0]?nmTag(n,q):`<em class="ph">${esc(n)}</em>`}</span>`).join('')}</div>
    </div>
    ${(m.rest?.length||m.by||m.addedBy||m.editedBy)?`<div class="m-foot">${m.rest?.length?`<span><span class="ms">chair</span> Nghỉ: ${m.rest.map(r=>hl(r,q)).join(', ')}</span>`:''}${m.by?`<span><span class="ms">edit</span> ${esc(m.by)} · ${atLabel(m.at)}</span>`:''}${m.addedBy?`<span class="addnote">✍ Trận do <b>${esc(m.addedBy)}</b> thêm tay, không phải app xếp</span>`:m.editedBy?`<span class="addnote">✏ <b>${esc(m.editedBy)}</b> đã sửa người/thể loại trận này</span>`:''}</div>`:''}
    ${expanded&&s.status==='MO'?`<div class="m-cta"><span class="btn filled sm"><span class="ms">edit_note</span>${done?'Sửa tỷ số':'Nhập tỷ số'}</span></div>`:''}
  </div>`;
}
function matchRow(m,q,nextId){
  const s=S.session, done=!!m.win, mc=s.courts>1;
  const A=m.win==='A'?'win':m.win?'lose':'', B=m.win==='B'?'win':m.win?'lose':'';
  return `<button class="mrow ${mc?'tint '+cc(m.court):`z${m.no%2}`} ${m.id===nextId?'next':''} ${m.saving?'saving':''} ${m.saving==='queue'?'queued':''}" data-act="expand" data-id="${m.id}" aria-label="Trận ${m.no}">
    <span class="r-no">${m.no}${m.addedBy?`<i class="addby" title="${esc(m.addedBy)} thêm tay">✍</i>`:m.editedBy?`<i class="addby ed" title="${esc(m.editedBy)} sửa tay">✏</i>`:''}</span>${mc?`<span class="cbadge ${cc(m.court)}" title="${esc(courtName(s,m.court))}">${esc(courtShort(s,m.court))}</span>`:''}
    ${m.stage?`<span class="stg">${STAGE_SHORT[m.stage]}</span>`:''}<span class="r-team ${A}">${teamTxt(m,'a',q,'<i>·</i>')}</span>
    <span class="r-score ${done?'':'empty'}">${done?`${m.sa}-${m.sb}`:'0-0'}${mBadges(m,s)}</span>
    <span class="r-team b ${B}">${teamTxt(m,'b',q,'<i>·</i>')}</span></button>`;
}
function schedItems(s,ms){ const fr=(s&&s.freeSlots||[]).map(([round,court])=>({free:1,round,court})); return fr.length?[...ms,...fr].sort((a,b)=>a.round-b.round||a.court-b.court||(a.free?1:0)-(b.free?1:0)):ms; }
function freeRow(s,f){ const mc=s.courts>1, ex=extraOf(s);
  return `<button class="mrow freerow ${mc?'tint '+cc(f.court):''}" ${s.status==='MO'?`data-act="addMatch" data-r="${f.round}" data-c="${f.court}"`:''} aria-label="Lượt đánh vui ${roundTime(s,f)}"><span class="r-no">🎲</span>${mc?`<span class="cbadge ${cc(f.court)}">${esc(courtShort(s,f.court))}</span>`:''}<span class="fr-t"><b>Đánh vui · tự cặp</b> <small>${roundTime(s,f)}${ex.length?' · '+esc(ex.join(', '))+' + người đang nghỉ':''}${s.status==='MO'?' · bấm để ghi trận':''}</small></span></button>`; }
function matchItem(m,q,nextId){
  if(m.free) return freeRow(S.session,m);
  if(S.view==='full') return matchCard(m,q,nextId,false);
  return S.openId===m.id?matchCard(m,q,nextId,true):matchRow(m,q,nextId);
}
function listWrap(inner){ return `<div class="${S.view==='full'?'list':'rows glass'}">${inner}</div>`; }
function renderList(){
  const el=$('#mlist'); if(!el) return;

  const names=[...new Set(S.session.players.filter(p=>fold(p).includes(q)))];

      <div class="kv"><small>Lịch</small><b>${pp.games} trận</b></div><div class="kv"><small>Thắng–Thua</small><b><span class="pos">${pp.w}</span>–<span class="neg">${pp.l}</span></b></div>
      <div class="kv"><small>Tạm tính</small><b class="${pp.owe?'neg':'pos'}">${kmoney(pp.owe)}</b></div>
      ${names[0]!==S.me?`<button class="btn text sm" data-act="setMe" data-name="${esc(names[0])}">Đây là tôi</button>`:''}</div>`;
  }
  if(!mine.length){ el.innerHTML=head+`<div class="empty glass"><span class="ms">person_search</span><b>Không có trận nào có “${esc(S.q)}”</b><div class="sub">Thử gõ không dấu, ví dụ: dung, tuan.</div></div>`; return; }
  el.innerHTML=head+bar+

    (done.length?`<h3>Đã có tỷ số · ${done.length}</h3>${listWrap(done.map(m=>matchItem(m,q,next?.id)).join(''))}`:'');

function openCourts(){

/* ---------- thống kê tháng / năm (bản đồ màu) ---------- */
function shiftMonth(m,d){const [y,mo]=m.split('-').map(Number);const t=new Date(y,mo-1+d,1);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`;}
function sessWL(sid){ const r={}; (S.allMatches||[]).filter(m=>m[0]===sid).forEach(([s,a1,a2,b1,b2,w])=>{
  [[a1,w==='A'],[a2,w==='A'],[b1,w==='B'],[b2,w==='B']].forEach(([n,won])=>{const x=r[n]||(r[n]={w:0,l:0}); won?x.w++:x.l++;});}); return r; }
/** Thống kê các buổi đã chốt: mỗi ô = tiền thua (tiền sân nếu vãng lai) + thắng–thua. */
function statData(mode,key){
  const closed=S.boot.sessions.filter(s=>s.status==='CHOT'&&!isTrial(s)&&(mode==='month'?s.date.slice(0,7)===key:s.date.slice(0,4)===key)).sort((a,b)=>a.date.localeCompare(b.date));
  const cols=mode==='month'?closed.map(s=>({key:s.id,label:shortDate(s.date),sids:[s.id],s}))
    :Array.from({length:12},(_,i)=>{const mk=`${key}-${String(i+1).padStart(2,'0')}`;return {key:mk,label:'T'+(i+1),sids:closed.filter(s=>s.date.slice(0,7)===mk).map(s=>s.id),month:mk};}).filter(c=>c.sids.length);
  const P={}; const g=n=>P[n]||(P[n]={name:n,cells:{},lose:0,share:0,w:0,l:0,att:0});
  cols.forEach(c=>c.sids.forEach(sid=>{
    const s=S.boot.sessions.find(x=>x.id===sid), wl=sessWL(sid);
    s.players.forEach(n=>{const x=g(n),cell=x.cells[c.key]||(x.cells[c.key]={lose:0,share:0,w:0,l:0,n:0,monthly:true});
      cell.n++; x.att++; const r=wl[n]||{w:0,l:0}; cell.w+=r.w; cell.l+=r.l; x.w+=r.w; x.l+=r.l; if(!monthlyOn(n,s.date)) cell.monthly=false;});
    S.boot.ledger.filter(l=>l.sessionId===sid&&l.type==='THU'&&l.person).forEach(l=>{const x=g(l.person),cell=x.cells[c.key]||(x.cells[c.key]={lose:0,share:0,w:0,l:0,n:0,monthly:true});
      if(l.category==='Tiền thua'){cell.lose+=l.amount;x.lose+=l.amount;}else{cell.share+=l.amount;x.share+=l.amount;}});
  }));
  const rows=Object.values(P).sort((a,b)=>b.lose-a.lose||b.att-a.att);
  const max=Math.max(1,...rows.flatMap(r=>Object.values(r.cells).map(c=>c.lose)));
  return {cols,rows,max};
}
function heatCell(c,max){
  if(!c) return `<td class="hc none">·</td>`;
  const t=c.lose/max, bg=c.lose?`background:color-mix(in srgb,var(--heat) ${Math.round(10+60*t)}%,transparent);${t>.6?'color:#fff':''}`:'';
  return `<td class="hc" style="${bg}"><b>${kmoney(c.lose)}${c.share?`<em>(${kmoney(c.share)})</em>`:''}</b><small>${c.w}T-${c.l}B${c.n>1?' · '+c.n+' buổi':''}</small></td>`;
}
function viewStats(){
  const mode=S.statMode||'month', key=mode==='month'?(S.statM||curMonth()):(S.statY||todayStr().slice(0,4));
  const D=statData(mode,key);
  const label=mode==='month'?'Tháng '+monthLabel(key):'Năm '+key;
  const nav=`<div class="statnav"><div class="seg mini"><button data-act="statMode" data-v="month" class="${mode==='month'?'on':''}">Theo buổi trong tháng</button><button data-act="statMode" data-v="year" class="${mode==='year'?'on':''}">Theo tháng trong năm</button></div>
    <div class="stepnav"><button class="icon-btn" data-act="statStep" data-d="-1" aria-label="Trước"><span class="ms">chevron_left</span></button><b>${label}</b><button class="icon-btn" data-act="statStep" data-d="1" aria-label="Sau"><span class="ms">chevron_right</span></button></div></div>`;
  if(!D.cols.length) return `<h3>Thống kê đã chốt</h3>${nav}<div class="empty glass" style="padding:18px"><span class="ms">grid_view</span><b>Chưa có buổi nào đã chốt trong ${label.toLowerCase()}</b></div>`;
  const totCol=c=>D.rows.reduce((t,r)=>t+(r.cells[c.key]?.lose||0),0);
  return `<h3>Thống kê đã chốt</h3>${nav}
  <div class="tbl-wrap glass heat"><table><thead><tr><th class="stk">Người</th>${D.cols.map(c=>`<th>${mode==='month'?`<button class="lnk" data-act="openSession" data-id="${c.key}">${c.label}</button>`:c.label}</th>`).join('')}<th>Tổng thua</th><th>Sân</th></tr></thead>
    <tbody>${D.rows.map(r=>`<tr><td class="stk"><b>${esc(r.name)}</b><small>${r.att} buổi · ${r.w}T-${r.l}B</small></td>${D.cols.map(c=>heatCell(r.cells[c.key],D.max)).join('')}
      <td><b class="${r.lose?'neg':''}">${kmoney(r.lose)}</b></td><td>${r.share?kmoney(r.share):'–'}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td class="stk">${D.rows.length} người</td>${D.cols.map(c=>`<td>${kmoney(totCol(c))}</td>`).join('')}<td>${kmoney(D.rows.reduce((t,r)=>t+r.lose,0))}</td><td>${kmoney(D.rows.reduce((t,r)=>t+r.share,0))}</td></tr></tfoot></table></div>
  <div class="sub" style="padding:0 6px">Ô càng đỏ đậm = thua càng nhiều. Số trong ngoặc là tiền sân/nước của người <b>vãng lai</b>; thành viên tháng chỉ hiện tiền thua. ${mode==='month'?'Bấm ngày để mở buổi đó.':''}</div>
  <button class="btn tonal" data-act="shareStats"><span class="ms">content_copy</span>Sao chép thống kê ${label.toLowerCase()}</button>`;
}
function shareStats(){
  const mode=S.statMode||'month', key=mode==='month'?(S.statM||curMonth()):(S.statY||todayStr().slice(0,4)), D=statData(mode,key);
  const lines=[`📊 Thống kê ${mode==='month'?'tháng '+monthLabel(key):'năm '+key} – ${S.boot.settings.clubName}`];
  D.cols.forEach(c=>{const ppl=D.rows.filter(r=>r.cells[c.key]);
    lines.push(`${c.label} (${ppl.length} người): `+ppl.map(r=>{const x=r.cells[c.key];return `${r.name} ${kmoney(x.lose)}${x.share?`(${kmoney(x.share)})`:''}`;}).join(' · '));});
  lines.push('',`Tổng thua: `+D.rows.map(r=>`${r.name} ${kmoney(r.lose)}`).join(' · '));
  copyText(lines.join('\n'));
}

/** Gộp sổ của 1 buổi vừa được server tính lại vào dữ liệu đang có. */
function mergeSessLedger(sid,rows){ const all=(S.boot.ledgerAll||S.boot.ledger).filter(l=>l.sessionId!==sid).concat(rows); S.boot.ledger=all; S.boot.ledgerAll=null; prepBoot(S.boot); }
/** Tiền từng người của 1 buổi đã chốt, lấy từ sổ quỹ: thua, chia sân/nước, đã trả, còn nợ. */
function sessionMoney(sid){
  const rows={};
  (S.boot.ledgerAll||S.boot.ledger).filter(l=>l.sessionId===sid&&l.type==='THU'&&l.person).forEach(l=>{
    const r=rows[l.person]||(rows[l.person]={lose:0,share:0,paid:0,due:0,ids:[]});
    if(l.category==='Tiền thua') r.lose+=l.amount; else r.share+=l.amount;
    if(l.status==='DA_DONG') r.paid+=l.amount; else r.due+=l.amount;
    r.ids.push(l.id);
  });
  return rows;
}
function payBtn(name,r,compact){
  if(!r||!(r.lose+r.share)||isTrial(S.session)) return `<span class="paybtn none">–</span>`;
  const paid=r.due===0;
  return `<button class="paybtn ${paid?'on':''}" data-act="payToggle" data-ids="${r.ids.join(',')}" data-paid="${paid?0:1}" data-name="${esc(name)}" aria-label="${esc(name)}: ${paid?'Đã trả':'Chưa trả'}" title="${paid?'Đã trả':'Chưa trả'}"><span class="ms ${paid?'fill':''}">${paid?'check_circle':'radio_button_unchecked'}</span>${compact?'':(paid?'Đã trả':'Chưa trả')}</button>`;
}

/** Tạm tính tiền từng người khi buổi chưa chốt (chưa ghi vào sổ). */
/** Người góp tiền sân = người đánh + người "chỉ góp tiền" (không xếp trận). */
function sharePeople(s){const ex=(s.share&&s.share.extra)||[];return [...s.players,...ex.filter(x=>x&&!s.players.includes(x))];}
function extraOf(s){return ((s.share&&s.share.extra)||[]).filter(x=>x&&!s.players.includes(x));}
function previewMoney(s,ms){
  const pp=perPlayer(s,ms), out={};
  pp.forEach(r=>out[r.name]={lose:r.owe,share:0});
  const base=(+s.costSan||0)+(+s.costNuoc||0)+(+s.costKhac||0), sh=s.share||{enabled:true,rules:{}}, ppl=sharePeople(s);
  if((sh.enabled!==false||isAutoThang(s))&&base>0){ const rules={}; ppl.forEach(p=>rules[p]=ruleOf(s,p)||defaultRule(p,s.date));
    const c=computeShares(ppl,base,rules); Object.entries(c.shares).forEach(([p,v])=>{(out[p]=out[p]||{lose:0,share:0}).share=v;}); }
  return out;
}
/** Đối đầu trong buổi (dưới tab Tổng kết). */

  const names=Object.keys(cnt).sort((a,b)=>a===S.me?-1:b===S.me?1:cnt[b]-cnt[a]||a.localeCompare(b));

}

/* ====================== ĐỐI ĐẦU (head-to-head) ====================== */
/** Dòng api_allMatches → trận. Cột: buổi, A1, A2, B1, B2, thắng, điểm A, điểm B, stt, chế độ, thể loại, lượt. */
const amObj=r=>({sid:r[0],a:[r[1],r[2]],b:[r[3],r[4]],win:r[5],sa:r[6],sb:r[7],no:r[8],mode:r[9]||'',kind:r[10]||'',round:r[11],addedBy:r[12]||''});
/** H[x][y] = {w,l}: x gặp y (đối thủ). Pp[x][y] = cùng đội. Tính cả trận giao lưu. */
function h2hOf(ms){
  const H={},Pp={}; const g=(o,x,y)=>((o[x]=o[x]||{})[y]=o[x][y]||{w:0,l:0});
  ms.forEach(m=>{ if(!m.win) return; const A=m.a.filter(Boolean),B=m.b.filter(Boolean),aw=m.win==='A';
    A.forEach(x=>B.forEach(y=>{ g(H,x,y)[aw?'w':'l']++; g(H,y,x)[aw?'l':'w']++; }));
    [[A,aw],[B,!aw]].forEach(([t,w])=>{ if(t.length===2){ g(Pp,t[0],t[1])[w?'w':'l']++; g(Pp,t[1],t[0])[w?'w':'l']++; } }); });
  return {H,P:Pp};
}
const short3=n=>[...String(n)].slice(0,3).join('');
/** Bảng đối đầu dạng ma trận: đọc theo HÀNG (người ở hàng gặp người ở cột: thắng–thua). */
function h2hMatrix(H,names,act){
  if(!names.length) return '';
  return `<div class="tbl-wrap glass h2h"><table><thead><tr><th class="corner">Hàng gặp cột</th>${names.map(n=>`<th title="${esc(n)}">${esc(short3(n))}</th>`).join('')}</tr></thead><tbody>
    ${names.map(n=>`<tr class="${n===S.me?'me':''}"><th data-act="${act||'pMatches'}" data-name="${esc(n)}" role="button" tabindex="0">${esc(n)}</th>${names.map(o=>{ if(o===n) return '<td class="self"></td>';
      const r=H[n]&&H[n][o]; if(!r) return '<td class="nil">·</td>';
      return `<td class="${r.w>r.l?'up':r.w<r.l?'down':'eq'}" data-act="h2hPair" data-a="${esc(n)}" data-b="${esc(o)}" data-rel="opp" title="${esc(n)} gặp ${esc(o)}: ${r.w} thắng, ${r.l} thua">${r.w}-${r.l}</td>`;}).join('')}</tr>`).join('')}
  </tbody></table></div>`;
}
/** Danh sách đối thủ / đồng đội của 1 người. */
function h2hList(name,H,Pp){
  const opp=Object.entries(H[name]||{}).map(([n,r])=>({n,...r,p:r.w+r.l})).sort((a,b)=>b.p-a.p||b.w-a.w);
  const par=Object.entries(Pp[name]||{}).map(([n,r])=>({n,...r,p:r.w+r.l})).sort((a,b)=>b.p-a.p||b.w-a.w);
  const bar=(w,p)=>`<span class="wbar"><i style="width:${p?Math.round(w*100/p):0}%"></i></span>`;
  return `<h3>Đối đầu <small class="sub">· bấm để xem từng trận</small></h3><div class="panel glass">${opp.map(x=>`<button class="lrow" data-act="h2hPair" data-a="${esc(name)}" data-b="${esc(x.n)}" data-rel="opp">${avatar(x.n)}<div class="pname">vs ${esc(x.n)}<small>${x.p} lần gặp · thắng ${Math.round(x.w*100/x.p)}%</small></div><span class="lamt"><span class="pos">${x.w}T</span>–<span class="neg">${x.l}B</span> ${bar(x.w,x.p)}</span></button>`).join('')||'<div class="sub" style="padding:12px">Chưa có trận có tỷ số</div>'}</div>
    ${par.length?`<h3>Đánh cặp với</h3><div class="panel glass">${par.map(x=>`<button class="lrow" data-act="h2hPair" data-a="${esc(name)}" data-b="${esc(x.n)}" data-rel="part">${avatar(x.n)}<div class="pname">${esc(x.n)}<small>${x.p} trận cùng đội</small></div><span class="lamt"><span class="pos">${x.w}T</span>–<span class="neg">${x.l}B</span> ${bar(x.w,x.p)}</span></button>`).join('')}</div>`:''}`;
}
/** Tổng kết buổi: bấm tên → các trận của người đó trong buổi + đối đầu buổi. */
function openPMatches(name){

      <span class="lamt ${res==='W'?'pos':res==='L'?'neg':''}">${sc}</span></div>`; }).join('');

    ${h2hList(name,H,Pp)}`);
}
/** Từng trận giữa 2 người (đối đầu hoặc cùng cặp): ngày, tháng, thể loại, tỷ số, thắng/thua. Tính mọi buổi chính thức + buổi đang xem. */
function openH2HPair(a,b,rel){
  const ss={}; S.boot.sessions.forEach(x=>ss[x.id]=x);
  let ms=(S.allMatches||[]).map(amObj).filter(m=>ss[m.sid]&&!isTrial(ss[m.sid]));
  // trận của buổi đang mở có thể chưa có trong bộ đệm BXH
  if(S.session) ms=ms.filter(m=>m.sid!==S.session.id).concat(S.matches.filter(m=>m.win).map(m=>({...m,sid:S.session.id})));
  const sideOf=(m,p)=>m.a.includes(p)?'a':m.b.includes(p)?'b':'';

function pKey(date,mode){ const y=date.slice(0,4), mo=+date.slice(5,7); return mode==='year'?y:mode==='quarter'?`${y}-Q${Math.ceil(mo/3)}`:date.slice(0,7); }
function pShift(k,mode,d){ if(mode==='year') return String(+k+d); if(mode==='month') return shiftMonth(k,d);
  let [y,q]=k.split('-Q').map(Number); q+=d; while(q<1){q+=4;y--;} while(q>4){q-=4;y++;} return `${y}-Q${q}`; }
const pLabel=(k,mode)=>mode==='year'?'Năm '+k:mode==='quarter'?`Quý ${k.slice(6)}/${k.slice(0,4)}`:'Tháng '+monthLabel(k);

/* ---------- Bảng xếp hạng ---------- */
const PERIODS=[['month','Tháng này'],['quarter','3 tháng'],['year','Năm nay'],['all','Tất cả']];
function inPeriod(date,p){
  if(p==='all') return true;
  const d=pd(date), now=new Date();
  if(p==='month') return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  if(p==='year') return d.getFullYear()===now.getFullYear();
  if(p==='quarter') return (now-d)/864e5<=92;
  return true;
}
/** Điểm xếp hạng = Thắng×3 + Thua×0 + Buổi tham dự×6 (chuyên cần = 2 trận thắng). Trận giao lưu không tính. Hòa điểm: nhiều trận thắng hơn → hiệu số điểm tốt hơn. */
const RTYPES=[['all','Tổng'],['THANG','🗓 Buổi tháng'],['VL','🎟 Vãng lai']];
function rankData(period,type){
  type=type||S.rankT||'all';
  const sess={}; S.boot.sessions.filter(s=>s.doneCount&&!isTrial(s)&&inPeriod(s.date,period)&&(type==='all'||sessType(s)===type)).forEach(s=>sess[s.id]=s);
  const P={}; const g=n=>P[n]||(P[n]={name:n,att:0,p:0,w:0,l:0,pf:0,pa:0,form:[],streak:0,best:0,ls:0,worst:0});
  Object.values(sess).forEach(s=>s.players.forEach(p=>g(p).att++));
  const pairs={};
  const ms=(S.allMatches||[]).filter(m=>sess[m[0]]&&m[9]!=='GL').sort((a,b)=>(sess[a[0]].date+String(a[8]).padStart(3,'0')).localeCompare(sess[b[0]].date+String(b[8]).padStart(3,'0')));
  ms.forEach(([sid,a1,a2,b1,b2,win,sa,sb])=>{
    const A=[a1,a2],B=[b1,b2];
    [[A,win==='A',sa,sb],[B,win==='B',sb,sa]].forEach(([team,won,f,a])=>{
      team.filter(Boolean).forEach(n=>{const x=g(n);x.p++;x.pf+=+f||0;x.pa+=+a||0;
        if(won){x.w++;x.streak++;x.best=Math.max(x.best,x.streak);x.ls=0;}else{x.l++;x.streak=0;x.ls++;x.worst=Math.max(x.worst,x.ls);}
        x.form.push(won?'W':'L');});
      if(team.filter(Boolean).length===2){ const k=[...team].sort().join(' & '); const pr=pairs[k]||(pairs[k]={k,p:0,w:0}); pr.p++; if(won) pr.w++; }
    });
  });
  const list=Object.values(P).map(x=>({...x,pts:x.w*3+x.att*6,rate:x.p?x.w/x.p:0,diff:x.pf-x.pa,form:x.form.slice(-5)}))
    .sort((a,b)=>b.pts-a.pts||b.w-a.w||b.diff-a.diff||a.name.localeCompare(b.name));
  const minG=Math.max(3,Math.round((list.reduce((t,x)=>t+x.p,0)/(list.length||1))*0.5));
  const top=(arr,f)=>arr.length?arr.reduce((b,x)=>f(x)>f(b)?x:b):null;
  const pairList=Object.values(pairs).filter(x=>x.p>=3);
  const elig=list.filter(x=>x.p>=minG);
  // ---- số liệu cho danh hiệu vui ----
  const F={}; const f=n=>F[n]||(F[n]={name:n,close:0,closeL:0,egg:0,eggL:0,big:null,fine:0});
  const H={}, pl={}; const h=(x,y)=>((H[x]=H[x]||{})[y]=H[x][y]||{w:0,l:0});
  ms.forEach(([sid,a1,a2,b1,b2,win,sa,sb])=>{ if(!win) return;
    const W=(win==='A'?[a1,a2]:[b1,b2]).filter(Boolean), L=(win==='A'?[b1,b2]:[a1,a2]).filter(Boolean), ws=win==='A'?+sa:+sb, ls=win==='A'?+sb:+sa, mg=ws-ls;

    W.forEach(n=>{ const x=f(n); if(mg<=2) x.close++; if(ls<=3) x.egg++; if(!x.big||mg>x.big.mg) x.big={mg,sc:`${ws}–${ls}`,d:sess[sid].date}; });
    W.forEach(x=>L.forEach(y=>{ h(x,y).w++; h(y,x).l++; }));

  });
  S.boot.ledger.filter(l=>l.type==='THU'&&l.category==='Tiền thua'&&sess[l.sessionId]&&l.person).forEach(l=>f(l.person).fine+=l.amount);
  const fx=Object.values(F);
  let nem=null, riv=null;
  Object.keys(H).forEach(x=>Object.keys(H[x]).forEach(y=>{ const r=H[x][y], n=r.w+r.l;
    if(r.w>=3&&r.l===0&&(!nem||r.w>nem.w)) nem={k:`${x} → khắc ${y}`,w:r.w};
    if(x<y&&n>=4&&Math.abs(r.w-r.l)<=1&&(!riv||n>riv.n)) riv={k:`${x} ⚔ ${y}`,n,w:r.w,l:r.l}; }));
  const nS=Object.keys(sess).length, full=list.filter(x=>x.att===nS&&nS>=3);
  const hot=top(list.filter(x=>x.form.length>=4),x=>x.form.filter(v=>v==='W').length*1000+x.streak*10+x.w);

    ['military_tech','Vua chiến thắng',top(list,x=>x.w*1000+x.rate),x=>`${x.w} trận thắng`],
    ['percent','Tỷ lệ thắng cao nhất',top(elig,x=>x.rate*1000+x.p),x=>`${Math.round(x.rate*100)}% (${x.w}/${x.p}, tối thiểu ${minG} trận)`],

    ['trending_up','Hiệu số điểm đẹp nhất',top(list,x=>x.diff),x=>`${x.diff>0?'+':''}${x.diff} điểm`],

    ['egg','Thợ làm bánh trứng',top(fx.filter(x=>x.egg>=1),x=>x.egg),x=>`${x.egg} trận cho đối thủ ≤ 3 điểm`],

function assignNicks(list,F,minG,H,nMatch){

  const last3=(x,v)=>x.form.length>=3&&x.form.slice(-3).every(f=>f===v);

    ['ld',x=>last3(x,'W'),x=>x.streak*100+x.w],
    ['kt',x=>kt(x.name)>=2,x=>kt(x.name)*100+x.w],
    ['db',x=>el(x)&&x.diff>0,x=>x.pf/Math.max(1,x.p)],
    ['sat',x=>el(x)&&x.rate>=.6,x=>x.rate*1000+x.p],
    ['mc',x=>(fx(x.name).big||{}).mg>=6,x=>fx(x.name).big.mg],
    ['tkt',x=>fx(x.name).close>=2,x=>fx(x.name).close],
    ['cc',x=>x.att>=2,x=>x.att*100+x.p],
    ['cm',x=>el(x),x=>x.p],
    ['lk',x=>fx(x.name).close>=2&&fx(x.name).close>fx(x.name).closeL,x=>fx(x.name).close*100-fx(x.name).closeL],
    ['cb',x=>x.p>=4&&Math.abs(x.w-x.l)<=1,x=>x.p],
    ['lop',x=>x.diff<0&&x.rate>=.45,x=>x.rate],
    ['rua',x=>el(x)&&x.rate<.45&&weak(x),x=>-x.rate*1000+x.p],
    ['toang',x=>x.worst>=3&&weak(x),x=>x.worst*100+x.l],
    ['tim',x=>last3(x,'L')&&weak(x),x=>x.l],
    ['den',x=>rk[x.name]===n-1&&n>4,()=>1],
    ['nc',x=>el(x)&&weak(x),x=>x.pa/Math.max(1,x.p)],
    ['bc',x=>x.l>=3&&weak(x),x=>x.l*100-x.w],
    ['qua',x=>fx(x.name).eggL>=1&&weak(x),x=>fx(x.name).eggL*100+x.l],
    ['banh',x=>fx(x.name).egg>=1,x=>fx(x.name).egg],
    ['tai',x=>fx(x.name).fine>0,x=>fx(x.name).fine],
    ['ttk',x=>x.l>=3&&x.l>x.w&&x.att>=2,x=>x.l*100+x.att],
  ];
  // xáo thứ tự xét theo ngày + số trận (mỗi ngày / mỗi trận mới → biệt hiệu thay đổi)
  let seed=(Math.floor(Date.now()/864e5)*131+(nMatch||0)*7)>>>0;
  const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
  const order=R.map(r=>[rnd(),r]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  // giữ "Vua Sân Pick" xét trước để luôn có vua
  order.sort((a,b)=>(a[0]==='vua'?-1:0)-(b[0]==='vua'?-1:0));
  order.forEach(([k,ok,sc])=>{ const c=list.filter(x=>!x.nk&&ok(x)).sort((a,b)=>sc(b)-sc(a))[0]; if(c) c.nk={k,...NICKS[k]}; });
  list.forEach((x,i)=>{ if(x.nk) return; const r=i/n, k=x.p<minG?'new':r>=.67?'low':r<.34?'top':'mid'; x.nk={k,...NICKS[k]}; });
  list.forEach(x=>x.nick=`${x.nk.t} ${x.nk.ic}`);
}

/* ---------- gửi tỷ số + hàng chờ khi mạng yếu ---------- */
const OUTBOX='sopick_outbox';
const isNetErr=e=>/Mất mạng|Không kết nối|Failed to fetch|NetworkError|network|timed? ?out|quá lâu|Máy chủ lỗi 5|Load failed/i.test(String((e&&e.message)||e));
function outbox(){ try{ return JSON.parse(store.get(OUTBOX)||'[]'); }catch(e){ return []; } }
function setOutbox(q){ store.set(OUTBOX,q.length?JSON.stringify(q):null); }
function sendScore(m,a,b,by,prevAt,before){
  call('api_saveScore',m.id,a,b,by,prevAt).then(r=>{
    if(r.conflict){ Object.assign(m,r.match,{saving:false}); render(); toast(`${r.match.by} vừa nhập ${r.match.sa??'–'}–${r.match.sb??'–'} trước bạn. Mở trận để xem / ghi đè.`); return; }
    Object.assign(m,r.match,{saving:false}); if(r.ledger) mergeSessLedger(m.sessionId,r.ledger); render(); cupAutoFill(); saveCache&&saveCache();
  }).catch(e=>{
    if(isNetErr(e)){ setOutbox(outbox().filter(x=>x.id!==m.id).concat([{id:m.id,a,b,by,prevAt,prev:{sa:before.sa,sb:before.sb,win:before.win,by:before.by,at:before.at}}])); m.saving='queue'; render(); toast('Mạng yếu – tỷ số đã giữ trên máy, sẽ tự gửi khi có mạng'); }
    else { Object.assign(m,before,{saving:false}); render(); fail(e); }
  });
}
function flushOutbox(){
  const q=outbox(); if(!q.length||flushOutbox.busy||navigator.onLine===false) return;
  flushOutbox.busy=1; const it=q[0];
  call('api_saveScore',it.id,it.a,it.b,it.by,it.prevAt).then(r=>{
    setOutbox(outbox().filter(x=>x.id!==it.id)); flushOutbox.busy=0;
    const m=S.matches.find(x=>x.id===it.id); if(m){ Object.assign(m,r.match,{saving:false}); render(); }
    toast(r.conflict?`Trận đã có người khác nhập ${r.match.sa}–${r.match.sb}`:`Đã gửi tỷ số chờ (${it.a}–${it.b})`); flushOutbox();
  }).catch(e=>{ flushOutbox.busy=0; if(!isNetErr(e)){ // máy chủ từ chối (vd buổi đã chốt) → bỏ tỷ số chờ, trả lại như cũ
      setOutbox(outbox().filter(x=>x.id!==it.id)); const m=S.matches.find(x=>x.id===it.id);
      if(m) Object.assign(m,it.prev||{sa:null,sb:null,win:''},{saving:false}); render(); fail(new Error(`Không gửi được tỷ số ${it.a}–${it.b}: ${e.message}`)); } });
}
/** Tỷ số còn trong hàng chờ → hiện lại trên danh sách (kể cả sau khi tắt mở app). */
function applyOutbox(){ outbox().forEach(it=>{ const m=S.matches.find(x=>x.id===it.id); if(m&&!m.saving) Object.assign(m,{sa:it.a,sb:it.b,win:it.a>it.b?'A':'B',by:it.by,saving:'queue'}); }); }

/** Nhãn nhỏ cho trận: Đơn / Mix / Giao lưu / mức tiền riêng. */
function mBadges(m,s,big){
  const t=[]; if(m.kind==='DON') t.push(['k','Đơn']); else if(m.kind==='MIX') t.push(['k','Mix']);
  if(m.mode==='GL') t.push(['gl','Giao lưu']); else if(m.fee!=null&&m.fee!==''&&+m.fee!==+s.fee) t.push(['fee',kmoney(+m.fee)]);
  return t.map(([c,l])=>big?`<span class="mtag2 ${c}">${l}</span>`:`<i class="mk ${c}">${l}</i>`).join('');
}
/** Lượt đang diễn ra (nếu hôm nay là ngày buổi đánh), không thì lượt sau cùng. */
function nowRound(s,maxR){ if(s.date!==todayStr()) return maxR+1; const d=new Date(), r=Math.floor((d.getHours()*60+d.getMinutes()-hm2m(s.start))/s.minPer)+1; return Math.max(1,Math.min(maxR+1,r)); }
/* ---------- Gợi ý cặp đấu theo lịch sử (Thêm / sửa trận) ---------- */
function histIndex(){
  const ss={}; S.boot.sessions.forEach(x=>ss[x.id]=x);
  const key=(...a)=>a.filter(Boolean).sort().join('|'), team=t=>key(...t);
  const part={},opp={},vs={};
  let ms=(S.allMatches||[]).map(amObj).filter(m=>ss[m.sid]&&!isTrial(ss[m.sid])).map(m=>({...m,date:ss[m.sid].date}));
  if(S.session) ms=ms.filter(m=>m.sid!==S.session.id).concat(S.matches.map(m=>({...m,sid:S.session.id,date:S.session.date,cur:true})));
  ms.forEach(m=>{ const A=m.a.filter(Boolean),B=m.b.filter(Boolean); if(!A.length||!B.length) return;
    [A,B].forEach(t=>{ if(t.length===2){ const k=team(t), x=part[k]||(part[k]={n:0,last:''}); x.n++; if(m.date>x.last) x.last=m.date; } });
    A.forEach(x=>B.forEach(y=>{ const k=key(x,y); opp[k]=(opp[k]||0)+1; }));
    const vk=[team(A),team(B)].sort().join(' vs '), v=vs[vk]||(vs[vk]={n:0,list:[]}); v.n++; v.list.push(m); });
  return {part,opp,vs,team,key,vsOf:(A,B)=>vs[[team(A),team(B)].sort().join(' vs ')]};
}
/** Đề xuất trận: người ít trận trong buổi, cặp chưa đánh cùng, 2 đội chưa gặp nhau (xét mọi buổi + buổi này). */
function suggestMatches(s,M,editId){

/* ---------- sổ chính thức (đầu kỳ) ---------- */
const isTrial=s=>{const st=S.boot?.settings?.startDate;return !!(st&&s&&s.date<st);};
function prepBoot(b){
  if(b.ledgerA){ // sổ gửi dạng mảng gọn → đổi lại thành object
    b.ledger=b.ledgerA.map(a=>({id:a[0],date:a[1],sessionId:a[2],type:a[3],category:a[4],person:a[5],amount:a[6],status:a[7],note:a[8],by:a[9],at:a[10]}));
    delete b.ledgerA;
  } else if(b.ledgerAll&&b.ledger!==b.ledgerAll) return b; // đã xử lý rồi
  const st=b.settings.startDate||'';
  b.ledgerAll=b.ledger;
  // Quỹ tháng: tính theo tháng; khoản đã đóng TRƯỚC ngày mở sổ coi như đã nằm trong số dư đầu kỳ
  if(st) b.ledger=b.ledger.filter(l=>String(l.sessionId).startsWith('QT-')?(l.sessionId.slice(3)>=st.slice(0,7)&&(l.status==='CHUA_DONG'||String(l.at)>=st)):l.date>=st);
  return b;
}
function openBooks(){

/* ---------- Sửa buổi: luật tiền, người tham dự, tiền sân đã trả, cách chia (1 lần Lưu) ---------- */
/** Giá vãng lai đề xuất: lấy giá vãng lai dùng gần nhất trong các buổi, chưa có thì 80k. */
function lastVL(){ for(const s of (S.boot?.sessions||[])){ const r=Object.values(s.share?.rules||{}).find(x=>x&&x.mode==='fixed'&&+x.amount>0); if(r) return +r.amount; } return 80000; }
/** Mặc định: đã đăng ký tháng → quỹ tháng trả; tháng có người đánh tháng → người khác là vãng lai (giá gần nhất); không ai đánh tháng → chia đều. */
const defaultRule=(p,date)=>{ if(S.boot.settings.monthlyFree&&monthlyOn(p,date)) return {mode:'fund',amount:lastVL()};
  return monthRegs(String(date).slice(0,7))?{mode:'fixed',amount:lastVL()}:{mode:'eq',amount:lastVL()}; };
/** Thứ đánh tháng (Cài đặt, mặc định thứ 5). */
const monthDow=()=>{const v=S.boot?.settings?.monthDow;return v===undefined||v===null||v===''?4:+v;};
/** Buổi tháng tự động: ĐK tháng → quỹ trả sân; người ngoài → giá vãng lai. Buổi tháng cũ (tắt chia, chưa bấm tắt tay) cũng tính là tự động. */
const isAutoThang=s=>{const sh=(s&&s.share)||{};return sh.auto==='THANG'||(!!s&&s.sessType==='THANG'&&sh.enabled===false&&!sh.off);};
const thangRule=(p,date,vl)=>{const regs=monthRegs(String(date).slice(0,7)),a=+vl||lastVL();return !regs||regs.has(p)?{mode:'fund',amount:a}:{mode:'fixed',amount:a};};
const ruleOf=(s,p)=>{const sh=(s&&s.share)||{};return (sh.rules||{})[p]||(isAutoThang(s)?thangRule(p,s.date,sh.vl):null);};
const thangOverrides=(rules,date,vl)=>Object.fromEntries(Object.entries(rules).filter(([p,r])=>{const d=thangRule(p,date,vl);return r&&(r.mode!==d.mode||(r.mode==='fixed'&&+r.amount!==+d.amount));}));
/** Mô tả ngắn cho buổi tháng: ai quỹ trả, ai đóng vãng lai. */
function thangInfo(ppl,date,vl){ const m=String(date).slice(0,7), regs=monthRegs(m);
  if(!regs) return `Tháng ${monthLabel(m)} chưa ai đăng ký đánh tháng → quỹ trả toàn bộ tiền sân.`;
  const inn=ppl.filter(p=>regs.has(p)), out=ppl.filter(p=>!regs.has(p));
  return `🗓 <b>${inn.length}</b> người đăng ký tháng ${monthLabel(m)} → quỹ trả sân/nước, chỉ tính tiền thua.${out.length?` Không đăng ký tháng: <b>${esc(out.join(', '))}</b> → đóng vãng lai ${kmoney(+vl||lastVL())}/người.`:''}`; }
/** Xếp lại các trận chưa đánh: dùng mọi lượt/sân còn trống (kể cả lượt sớm hơn trận đã có tỷ số). */
function reschedulePlan(s,played,players,opt){
  opt=opt||{K:s.freeK||0,ex:extraOf(s).length>0};
  const all=Array.from({length:s.courts},(_,i)=>i+1);
  const full=s.courtTimes?buildPlan(s.courtTimes,s.minPer).plan:Array.from({length:Math.max(1,Math.floor(s.duration/s.minPer))},()=>all);
  const used={}; played.forEach(m=>{used[m.round]=1;}); // lượt đã có trận đánh rồi thì không xếp thêm (tránh trùng người)
  const maxPlayed=played.length?Math.max(...played.map(m=>m.round)):0;
  const len=Math.max(full.length,maxPlayed);
  const avail=[]; for(let r=1;r<=len;r++){ if(used[r]) continue; const cs=full[r-1]||all; if(cs.length) avail.push({round:r,courts:cs}); }
  const kept=(s.freeSlots||[]).filter(f=>used[f[0]]); // lượt đánh vui đã qua giữ nguyên
  reschedulePlan.free=kept; reschedulePlan.renumber=[];
  if(!avail.length) return [];
  const type=s.playType||'DN', fem=sessFemale(s), cap=capOf(players.length,type,players.filter(p=>fem.has(p)).length);
  const RF=reserveFree(avail.map(x=>({round:x.round,courts:x.courts.slice()})),cap,Math.max(0,(opt.K||0)-kept.length),!!opt.ex);
  reschedulePlan.free=kept.concat(RF.free).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(!RF.rows.some(x=>x.courts.length)) return [];
  const gen=generateSchedule(players,RF.rows.map(x=>x.courts),s.courts,played,1,0,{type,female:fem,...(()=>{ const r=histScope()==='off'?null:rotation(players,{scope:histScope(),type:sessType(s),date:s.date,excludeSid:s.id,single:type==='DON'}); return r?{carry:r.carry,prior:r.prior}:{}; })()}).matches;
  // đánh số lại cả buổi theo thứ tự giờ (trận đã đánh giữ nguyên, chỉ đổi số thứ tự)
  const merged=[...played.map(m=>({...m,old:true})),...gen.map(m=>({...m,round:avail[m.round-1].round}))].sort((a,b)=>a.round-b.round||a.court-b.court);
  merged.forEach((m,i)=>m.no=i+1);
  reschedulePlan.renumber=merged.filter(m=>m.old).map(m=>({id:m.id,no:m.no}));
  return merged.filter(m=>!m.old).map(({old,...m})=>m);
}

  const resched=()=>{const m=reschedulePlan(s,played,[...E.players],{K:E.K,ex:exNow().length>0});E.free=reschedulePlan.free;E.renum=reschedulePlan.renumber||[];return m;};

      :{enabled:E.share,rules:Object.fromEntries([...E.players,...E.extra].map(p=>[p,rule(p)])),extra:[...E.extra].filter(p=>!E.players.has(p))}};

  };
  openEdit.E=E; openEdit.draw=draw;
  openSheet(''); draw();
}
const EditActs={
  eFee(t){openEdit.E.fee=+t.dataset.v;openEdit.draw();},
  eAutoSan(){const s=S.session;openEdit.E.san=Math.round(s.courtTimes.reduce((t,c)=>t+Math.max(0,hm2m(c.end)-hm2m(c.start)),0)/60*s.courtPrice);openEdit.draw();},
  eShare(){openEdit.E.share=!openEdit.E.share;openEdit.draw();},
  eStype(t){const E=openEdit.E;E.stype=t.dataset.v;E.share=true;E.rules={};if(E.stype==='VL')[...E.players,...E.extra].forEach(p=>E.rules[p]={mode:'eq',amount:lastVL()});openEdit.draw();},
  eToggle(t){const E=openEdit.E,n=t.dataset.name;if(E.players.has(n))E.players.delete(n);else{E.players.add(n);E.extra.delete(n);}E.preview=null;openEdit.draw();},
  eGen(){openEdit.E.preview=null;openEdit.draw();},
  eK(t){const E=openEdit.E,d=+t.dataset.d;E.K=d?Math.max(0,E.K+d):+t.dataset.v;E.preview=null;openEdit.draw();},
  eExtra(){const E=openEdit.E,v=$('#eExtra').value.trim().toUpperCase();if(!v)return;
    if(E.players.has(v)){E.players.delete(v);E.preview=null;toast(v+' chuyển sang chỉ góp tiền (bỏ khỏi lịch đấu)');}
    E.extra.add(v);E.preview=null;openEdit.draw();},
  eExtraDel(t){openEdit.E.extra.delete(t.dataset.name);openEdit.E.preview=null;openEdit.draw();},
  eGuest(){const E=openEdit.E,v=$('#eGuest').value.trim().toUpperCase();if(!v)return;if(!E.guests.includes(v))E.guests.push(v);E.players.add(v);E.preview=null;openEdit.draw();},
  eMode(t){const E=openEdit.E,r=(E.rules[t.dataset.name]=E.rules[t.dataset.name]||{...(E.stype==='THANG'?thangRule(t.dataset.name,S.session.date,E.vl):{amount:lastVL()})});r.mode=t.dataset.mode;if(r.mode==='fixed'&&(!+r.amount||+r.amount===50000))r.amount=lastVL();openEdit.draw();},
};

  const totalLose=rows.reduce((t,r)=>t+r.owe,0);

  openSheet(`<div class="sh-head"><div><h2>Chốt buổi ${shortDate(s.date)}</h2><div class="sub">Ghi công nợ từng người vào sổ quỹ (tiền thua + phần sân/nước)</div></div><button class="icon-btn" data-act="closeSheet" aria-label="Đóng"><span class="ms">close</span></button></div>
    ${autoSan&&!s.costSan?`<div class="hint">Tiền sân gợi ý ${money(autoSan)} = ${s.courtTimes.map((c,i)=>esc(courtName(s,i+1))+' '+c.start+'–'+c.end).join(', ')} × ${kmoney(s.courtPrice)}/giờ. Sửa nếu hóa đơn khác.</div>`:''}
    ${isTrial(s)?`<div class="hint warn">Buổi này trước ngày sổ chính thức → chốt chỉ để tham khảo, không tính quỹ/công nợ.</div>`:''}
    ${left?`<div class="hint warn">Còn <b>${left}</b> trận chưa có tỷ số. Các trận này không tính tiền.</div>`:''}
    <div class="grid2"><div class="field"><label for="cSan">Tiền sân</label><input class="inp" id="cSan" inputmode="numeric" value="${s.costSan||autoSan||last.san||''}" placeholder="0"></div>
      <div class="field"><label for="cNuoc">Nước</label><input class="inp" id="cNuoc" inputmode="numeric" value="${s.costNuoc||last.nuoc||''}" placeholder="0"></div></div>
    <div class="grid2"><div class="field"><label for="cKhac">Chi khác</label><input class="inp" id="cKhac" inputmode="numeric" value="${s.costKhac||''}" placeholder="0"></div>

    <div class="mem" style="padding:4px 0"><div class="pname">Chia tiền sân/nước cho người tham dự<small>Tắt nếu quỹ trả toàn bộ tiền sân</small></div>
      <button class="switch ${C.enabled?'on':''}" id="shareSw" data-act="shareOn" aria-label="Bật chia tiền"></button></div>
    ${isAutoThang(s)?`<div class="hint">${thangInfo(PAY,s.date,s.share?.vl)}</div>`:''}
    <div id="shareBox"></div>
    <div class="calc" id="cCalc"></div>
    <div class="actions"><button class="btn filled big" id="cGo"><span class="ms">lock</span>Chốt & ghi sổ</button></div>`);
  const num=id=>parseInt(String($(id).value).replace(/\D/g,''),10)||0;
  const base=()=>num('#cSan')+num('#cNuoc')+num('#cKhac');
  const upd=(full)=>{
    const chi=base(), sh=C.enabled?computeShares(PAY,chi,C.rules):{shares:{},per:0};
    const box=$('#shareBox');
    if(!C.enabled) box.innerHTML='';
    else if(full||!box.innerHTML){
      box.innerHTML=`<div class="share-list">${PAY.map((p,i)=>{const r=C.rules[p];return `<div class="share-row">
        <div class="share-top"><span class="pname">${esc(p)}<small>${monthlyOn(p,s.date)?'TV tháng':'Vãng lai'} · thua ${kmoney(lose[p]||0)}</small></span><b id="sv_${i}"></b></div>
        <div class="seg mini">${[['eq','Chia đều'],['fixed','Vãng lai'],['free','Miễn'],...(monthlyOn(p,s.date)||r.mode==='fund'?[['fund','Quỹ tháng trả']]:[])].map(([m,l])=>`<button data-act="shareMode" data-name="${esc(p)}" data-mode="${m}" class="${r.mode===m?'on':''}">${l}</button>`).join('')}
        ${r.mode==='fixed'?`<input class="inp fx" data-fx="${esc(p)}" inputmode="numeric" value="${r.amount}" aria-label="Số tiền cố định cho ${esc(p)}">`:''}</div></div>`;}).join('')}</div>`;
    }
    if(C.enabled) PAY.forEach((p,i)=>{const e=$('#sv_'+i); if(e) e.innerHTML=`${kmoney((lose[p]||0)+(sh.shares[p]||0))}<small> = ${kmoney(lose[p]||0)} + ${kmoney(sh.shares[p]||0)}</small>`;});

      (()=>{ const fp=C.enabled?sh.per*fundN:0, back=Math.min(chi,shareTotal+fp), dư=Math.max(0,shareTotal+fp-chi);

       <span>🏸 <b>${esc(ownerName())}</b> ứng sân/nước <b class="neg">${money(chi)}</b> → được trả lại <b class="pos">${money(back)}</b> (mọi người chia${fp?' + quỹ tháng':''})${chi-back>0?` · còn tự chịu <b class="neg">${money(chi-back)}</b>`:''}</span>`; })();
  };
  openClose.C=C; openClose.upd=upd;

}

function debtGroupLabel(l){ if(l.sessionId==='DK') return 'Nợ đầu kỳ'; if(String(l.sessionId).startsWith('QT-')) return 'Quỹ tháng '+monthLabel(l.sessionId); if(l.sessionId) return 'Buổi '+shortDate(l.date); return l.category+' '+shortDate(l.date); }

/** Gom các khoản chưa đóng theo người → theo buổi/tháng. */
function debtsOf(ledger){
  const P={};
  ledger.filter(l=>l.type==='THU'&&l.person&&l.status==='CHUA_DONG').forEach(l=>{
    const p=P[l.person]||(P[l.person]={name:l.person,sum:0,groups:{},ids:[],oldest:l.date});
    const gk=l.sessionId||l.id, g=p.groups[gk]||(p.groups[gk]={key:gk,date:l.date,label:debtGroupLabel(l),items:[],sum:0});
    g.items.push(l); g.items.sort((a,b)=>noteKey(a.note)-noteKey(b.note)); g.sum+=l.amount; p.sum+=l.amount; p.ids.push(l.id); if(l.date<p.oldest) p.oldest=l.date;
  });
  return Object.values(P).map(p=>({...p,groups:Object.values(p.groups).sort((a,b)=>a.date.localeCompare(b.date))})).sort((a,b)=>b.sum-a.sum);
}

      needPin().then(pin=>call('api_deposit',D.who,amt,D.kind,$('#dpNote').value,pin,ensureMe())).then(b=>{S.boot=b;const c2=creditsOf()[D.who]||0;closeSheet();render();toast(D.kind==='in'?`Đã nhận ${kmoney(amt)} của ${D.who} · còn gửi ${kmoney(c2)}`:`Đã hoàn ${kmoney(amt)} cho ${D.who}`);}).catch(fail);};
  };

}
/** Chia tiền sân/nước của 1 buổi: thu lại bao nhiêu, quỹ tháng trả bao nhiêu, DƯ LÀM TRÒN vào quỹ bao nhiêu. */
function shareInfo(s){
  const base=(+s.costSan||0)+(+s.costNuoc||0)+(+s.costKhac||0), sh=s.share||{};
  if(!base||(sh.enabled===false&&!isAutoThang(s))) return null;
  const ppl=sharePeople(s), rules={}; ppl.forEach(p=>rules[p]=ruleOf(s,p)||(s.status==='CHOT'?{mode:'eq'}:defaultRule(p,s.date)));
  const c=computeShares(ppl,base,rules);
  let fixed=0,nEq=0,nFund=0; ppl.forEach(p=>{const m=(rules[p]||{mode:'eq'}).mode; if(m==='fixed') fixed+=c.shares[p]||0; else if(m==='fund'){nEq++;nFund++;} else if(m!=='free') nEq++;});
  const collected=Object.values(c.shares).reduce((a,b)=>a+b,0), fund=c.per*nFund;
  const exact=nEq?Math.max(0,(base-fixed)/nEq):0, round=nEq&&base>fixed?Math.round((c.per-exact)*nEq):0;
  const over=Math.max(0,fixed-base); // vãng lai trả cố định nhiều hơn tổng chi
  return {base,collected,fund,nFund,per:c.per,round,over,surplus:collected+fund-base};
}
function roundingNote(s){
  const x=shareInfo(s); if(!x) return '';
  return `<div class="calc rnd"><span>Tiền sân/nước: chi <b>${money(x.base)}</b> · người chơi góp <b>${money(x.collected)}</b>${x.nFund?` · quỹ tháng trả ${x.nFund} suất × ${kmoney(x.per)} = <b>${money(x.fund)}</b>`:''}</span>
    ${x.round||x.over?`<span>💰 <b class="pos">Dư làm tròn +${money(x.round)}</b>${x.over?` · dư từ vãng lai +${money(x.over)}`:''} → vào quỹ (mỗi suất làm tròn lên ${kmoney(x.per)})</span>`:'<span>Không có tiền dư làm tròn.</span>'}</div>`;
}

function monthlyStatus(month){
  const key='QT-'+month, rows=(S.boot.ledgerAll||S.boot.ledger).filter(l=>l.sessionId===key);
  const prev=monthRegs(shiftMonth(month,-1));
  const regs=prev?[...prev]:[]; // gợi ý: người đăng ký tháng trước
  // gom theo người (1 người có thể có 2 dòng khi trừ 1 phần bằng tiền gửi trước)
  const P={}; rows.forEach(l=>{ const x=P[l.person]||(P[l.person]={name:l.person,ids:[],paidIds:[],dueIds:[],amount:0,paidAmt:0,viaDep:false});
    x.ids.push(l.id); x.amount+=l.amount; if(l.status==='DA_DONG'){ x.paidIds.push(l.id); x.paidAmt+=l.amount; if(viaDep(l)) x.viaDep=true; } else x.dueIds.push(l.id); });
  const people=Object.values(P); people.forEach(x=>x.paid=!x.dueIds.length);
  return {key,rows,people,byName:P,regs,paid:people.filter(x=>x.paid),missing:regs.filter(n=>!P[n]),
    sum:rows.reduce((t,l)=>t+l.amount,0),paidSum:rows.filter(l=>l.status==='DA_DONG').reduce((t,l)=>t+l.amount,0)};
}
