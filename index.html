/* ---------- Sổ thu chi: dòng tiền thật + lọc theo thành viên ---------- */
const LG_MODES=[['flow','Dòng tiền'],['in','Thu vào'],['out','Chi ra'],['due','Chưa trả']];
const viaDep=l=>/trừ tiền gửi trước/.test(l.note||'');
const lgWhen=l=>String(l.at||l.date||'');
/** Gom khoản thu theo lần đóng (cùng người, cùng phút ghi) → "VŨ đóng 488k (5 khoản)". */
function flowItems(L){
  const out=[], g={};
  L.filter(l=>l.type==='THU'&&l.status!=='CHUA_DONG'&&l.category!=='Trừ tiền gửi'&&!viaDep(l)).forEach(l=>{
    const k=(l.person||'')+'|'+lgWhen(l).slice(0,16)+'|'+(isDep(l)?l.category:''); (g[k]=g[k]||[]).push(l); });
  Object.values(g).forEach(it=>out.push({kind:it[0].amount<0?'out':'in',person:it[0].person,when:lgWhen(it[0]),amount:it.reduce((t,x)=>t+x.amount,0),items:it,by:it[0].by}));
  L.filter(l=>l.type==='CHI').forEach(l=>out.push({kind:'out',person:l.person,when:l.date+' '+String(l.at||'').slice(11,16),amount:l.amount,items:[l],by:l.by}));
  return out.sort((a,b)=>b.when.localeCompare(a.when));
}
const lgLabel=l=>`${l.category==='Chia sân/nước'?'Sân/nước':l.category}${l.sessionId&&!['DK','GT'].includes(l.sessionId)&&!String(l.sessionId).startsWith('QT-')?' '+shortDate(l.date):''}${l.sessionId==='DK'&&l.note?' ('+l.note+')':''}`;
function viewLedger(L){
  const mode=S.lgMode||'flow', who=S.lgWho||'', n=S.lgN||40, mon=S.lgMon||'';
  const people=[...new Set(L.map(l=>l.person).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const months=[...new Set(L.map(l=>(l.status==='DA_DONG'&&l.type==='THU'?lgWhen(l):l.date).slice(0,7)).filter(m=>/^\d{4}-\d{2}$/.test(m)))].sort().reverse();
  const inMon=w=>!mon||String(w).slice(0,7)===mon;
  let rows=[];
  if(who){ // lịch sử 1 người: mọi khoản (phải đóng, đã đóng lúc nào, trừ tiền gửi, gửi trước, tiền ứng)
    rows=L.filter(l=>l.person===who&&!(l.category==='Trừ tiền gửi')).map(l=>({l,when:l.status==='CHUA_DONG'||l.type==='CHI'?l.date:lgWhen(l)})).filter(x=>inMon(x.when)).sort((a,b)=>b.when.localeCompare(a.when));
  } else if(mode==='due') rows=L.filter(l=>l.type==='THU'&&l.status==='CHUA_DONG'&&inMon(l.date)).sort((a,b)=>b.date.localeCompare(a.date)).map(l=>({l,when:l.date}));
  else rows=flowItems(L).filter(x=>(mode==='flow'||x.kind===mode)&&inMon(x.when));
  const tin=who?0:rows.filter(x=>x.kind==='in').reduce((t,x)=>t+x.amount,0), tout=who?0:rows.filter(x=>x.kind==='out').reduce((t,x)=>t+x.amount,0);

function openPlayer(name){
  const p=S.rankP||'all', R=rankData(p,S.rankT||'all'), me=R.list.find(x=>x.name===name); if(!me) return;
  const sess={}; S.boot.sessions.filter(s=>!isTrial(s)&&inPeriod(s.date,p)&&((S.rankT||'all')==='all'||sessType(s)===S.rankT)).forEach(s=>sess[s.id]=1);
  const part={}, opp={};
  (S.allMatches||[]).filter(m=>sess[m[0]]).forEach(([sid,a1,a2,b1,b2,win])=>{
    const A=[a1,a2],B=[b1,b2]; let mine,other,won;
    if(A.includes(name)){mine=A;other=B;won=win==='A';} else if(B.includes(name)){mine=B;other=A;won=win==='B';} else return;
    const mate=mine.find(x=>x&&x!==name); if(mate){ const q=part[mate]||(part[mate]={n:mate,p:0,w:0}); q.p++; if(won) q.w++; }
    other.filter(Boolean).forEach(o=>{const r=opp[o]||(opp[o]={n:o,p:0,w:0}); r.p++; if(won) r.w++;});
  });
  const bar=(w,p)=>`<span class="wbar"><i style="width:${p?Math.round(w*100/p):0}%"></i></span>`;
  const rank=R.list.indexOf(me)+1;
  openSheet(`<div class="sh-head"><div style="display:flex;gap:12px;align-items:center">${avatar(name,48)}<div><h2>${esc(name)}</h2><div class="sub">Hạng ${rank}/${R.list.length} · ${me.pts} điểm · ${PERIODS.find(x=>x[0]===p)[1]}</div>${me.nk?`<div style="margin-top:4px">${nickTag(me,1)}</div><div class="sub" style="font-size:12px">${esc(me.nk.why)} · ${esc(me.nk.d)}</div>`:''}</div></div><button class="icon-btn" data-act="closeSheet" aria-label="Đóng"><span class="ms">close</span></button></div>
    <div class="stats"><div class="stat glass"><small>Buổi · Trận</small><b>${me.att} · ${me.p}</b></div><div class="stat glass"><small>Thắng–Thua</small><b><span class="pos">${me.w}</span>–<span class="neg">${me.l}</span></b></div>
      <div class="stat glass"><small>Tỷ lệ thắng</small><b>${Math.round(me.rate*100)}%</b></div><div class="stat glass"><small>Chuỗi thắng dài nhất</small><b>${me.best}</b></div></div>
    <h3>Đánh cặp với</h3><div class="panel glass">${Object.values(part).sort((a,b)=>b.w/b.p-a.w/a.p||b.p-a.p).map(x=>`<div class="lrow">${avatar(x.n)}<div class="pname">${esc(x.n)}<small>${x.p} trận cùng đội · thắng ${x.w}</small></div><span class="lamt">${Math.round(x.w*100/x.p)}% ${bar(x.w,x.p)}</span></div>`).join('')||'<div class="sub" style="padding:12px">Chưa có dữ liệu</div>'}</div>
    <h3>Đối đầu</h3><div class="panel glass">${Object.values(opp).sort((a,b)=>b.p-a.p).map(x=>`<button class="lrow" data-act="h2hPair" data-a="${esc(name)}" data-b="${esc(x.n)}" data-rel="opp">${avatar(x.n)}<div class="pname">vs ${esc(x.n)}<small>${x.p} lần gặp · bấm xem từng trận</small></div><span class="lamt"><span class="pos">${x.w}</span>–<span class="neg">${x.p-x.w}</span></span></button>`).join('')||'<div class="sub" style="padding:12px">Chưa có dữ liệu</div>'}</div>`);
}

const rankPts=()=>{ if(!S.allMatches) return {}; const o={}; rankData('all','all').list.forEach(x=>o[x.name]=x.pts); return o; };
/** Ghép đôi: ngẫu nhiên, hoặc cân bằng theo điểm BXH (mạnh nhất + yếu nhất). */
function pairTeams(F,balanced){
  let ps=[...F.players];
  if(balanced){ const pts=rankPts(); ps=shuffle(ps).sort((a,b)=>(pts[b]||0)-(pts[a]||0)); const out=[]; while(ps.length>1) out.push([ps.shift(),ps.pop()]); F.teams=out.map((p,i)=>({id:'D'+(i+1),p,seed:0})); }
  else { ps=shuffle(ps); F.teams=[]; for(let i=0;i+1<ps.length;i+=2) F.teams.push({id:'D'+(i/2+1),p:[ps[i],ps[i+1]],seed:0}); }
}

/* 2 bảng (có hạt giống) đánh vòng tròn → Bán kết: Nhất A–Nhì B, Nhất B–Nhì A → Tranh 3 & Chung kết.
   Tiền thua, chia sân/nước, BXH tính y như buổi thường. */
const isCup=s=>!!(s&&s.kind==='GIAI');
const STAGE_NAME={A:'Bảng A',B:'Bảng B',SF1:'Bán kết 1',SF2:'Bán kết 2','3RD':'Tranh hạng 3',F:'Chung kết'};
const STAGE_SHORT={A:'A',B:'B',SF1:'BK1',SF2:'BK2','3RD':'H3',F:'CK'};
const KO_LABEL={SF1:['Nhất A','Nhì B'],SF2:['Nhất B','Nhì A'],'3RD':['Thua BK1','Thua BK2'],F:['Thắng BK1','Thắng BK2']};
const tkey=p=>[...p].filter(Boolean).sort().join('|');
/** Tên hiển thị 1 bên của trận; trận loại trực tiếp chưa có đội thì hiện "Nhất A"… */
function sideNames(m,k){ const p=m[k]; if(p[0]||p[1]) return p; const lb=KO_LABEL[m.stage]; return lb?[lb[k==='a'?0:1],'']:p; }
const nmTag=(n,q)=>`<span class="nm" style="--nc:${avColor(n)}">${hl(n,q)}</span>`;
const teamTxt=(m,k,q,sep)=>{const n=sideNames(m,k),real=k==='a'?m.a[0]:m.b[0];if(!real)return `<em class="ph">${esc(n.filter(Boolean).join(' · '))}</em>`;const x=n.filter(Boolean);return x.map(v=>nmTag(v,q)).join(sep);};
const koReady=m=>!!(m.a[0]&&m.b[0]);

function rrRounds(ids){ const a=[...ids]; if(a.length%2) a.push(null); const n=a.length, R=[];
  for(let r=0;r<n-1;r++){ const pr=[]; for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i]; if(x!=null&&y!=null) pr.push([x,y]);} R.push(pr); a.splice(1,0,a.pop()); }
  return R; }
/** Chia bảng: hạt giống rắn (1→A, 2→B, 3→B, 4→A…), đội còn lại bốc thăm ngẫu nhiên vào bảng ít đội hơn. */
function drawGroups(teams){
  const seeds=teams.filter(t=>t.seed).sort((a,b)=>a.seed-b.seed), rest=shuffle(teams.filter(t=>!t.seed));
  const A=[],B=[];
  seeds.forEach((t,i)=>([0,3].includes(i%4)?A:B).push(t.id));
  rest.forEach(t=>(A.length<=B.length?A:B).push(t.id));
  return {A,B};
}
/** Xếp lịch giải theo các lượt sân (plan). Một đội không đánh 2 trận cùng lượt. */
function genCup(teams,groups,plan,courts){
  const T=Object.fromEntries(teams.map(t=>[t.id,t]));
  const RA=rrRounds(shuffle(groups.A.slice())), RB=rrRounds(shuffle(groups.B.slice()));
  const queue=[]; for(let r=0;r<Math.max(RA.length,RB.length);r++){ (RA[r]||[]).forEach(p=>queue.push({g:'A',p})); (RB[r]||[]).forEach(p=>queue.push({g:'B',p})); }
  const all=Array.from({length:courts},(_,i)=>i+1), cs=r=>plan[r]&&plan[r].length?plan[r]:all;
  const out=[]; let r=0;
  while(queue.length&&r<400){ const C=cs(r), busy=new Set(); let c=0;
    for(let i=0;i<queue.length&&c<C.length;){ const q=queue[i];
      if(busy.has(q.p[0])||busy.has(q.p[1])){i++;continue;}
      busy.add(q.p[0]);busy.add(q.p[1]); out.push({round:r+1,court:C[c++],stage:q.g,a:[...T[q.p[0]].p],b:[...T[q.p[1]].p]}); queue.splice(i,1); }
    r++; }
  [['SF1','SF2'],['3RD','F']].forEach(pair=>{ const C=cs(r);
    if(C.length>=2){ pair.forEach((st,i)=>out.push({round:r+1,court:C[i],stage:st,a:['',''],b:['','']})); r++; }
    else pair.forEach(st=>{ out.push({round:r+1,court:cs(r)[0],stage:st,a:['',''],b:['','']}); r++; }); });
  const allP=teams.flatMap(t=>t.p), byR={}; out.forEach(m=>(byR[m.round]=byR[m.round]||[]).push(m));
  out.forEach(m=>{ const on=new Set(byR[m.round].flatMap(x=>[...x.a,...x.b])); m.rest=(m.stage==='A'||m.stage==='B')?allP.filter(p=>!on.has(p)):[]; });
  return out.map((m,i)=>({...m,no:i+1}));
}
/** BXH từng bảng: thắng → hiệu số → điểm ghi được. */
function cupStandings(s,ms){
  const cup=s.cup||{}, T=Object.fromEntries((cup.teams||[]).map(t=>[t.id,t])), res={};
  ['A','B'].forEach(g=>{
    const rows=(cup.groups?.[g]||[]).map(id=>({team:T[id],key:tkey(T[id].p),p:0,w:0,l:0,pf:0,pa:0}));
    const by=Object.fromEntries(rows.map(r=>[r.key,r]));
    ms.filter(m=>m.stage===g&&m.win).forEach(m=>{ const A=by[tkey(m.a)],B=by[tkey(m.b)]; if(!A||!B) return;
      A.p++;B.p++;A.pf+=m.sa;A.pa+=m.sb;B.pf+=m.sb;B.pa+=m.sa; if(m.win==='A'){A.w++;B.l++;}else{B.w++;A.l++;} });
    rows.forEach(r=>r.diff=r.pf-r.pa);
    res[g]=rows.sort((x,y)=>y.w-x.w||y.diff-x.diff||y.pf-x.pf);
  });
  return res;
}
/** Tính đội cần điền vào bán kết / chung kết khi vòng trước đã xong. */
function cupFills(s,ms){
  const fills=[], get=st=>ms.find(m=>m.stage===st), grp=ms.filter(m=>m.stage==='A'||m.stage==='B');
  const want=(st,a,b)=>{const m=get(st); if(m&&!m.win&&(tkey(m.a)!==tkey(a)||tkey(m.b)!==tkey(b))) fills.push({id:m.id,a,b});};
  if(grp.length&&grp.every(m=>m.win)){ const S2=cupStandings(s,ms);
    if(S2.A.length>=2&&S2.B.length>=2){ want('SF1',S2.A[0].team.p,S2.B[1].team.p); want('SF2',S2.B[0].team.p,S2.A[1].team.p); } }
  const s1=get('SF1'),s2=get('SF2');
  if(s1&&s2&&s1.win&&s2.win){ const W=m=>m.win==='A'?m.a:m.b, L=m=>m.win==='A'?m.b:m.a;
    want('F',W(s1),W(s2)); want('3RD',L(s1),L(s2)); }
  return fills;
}
function cupAutoFill(){
  const s=S.session; if(!isCup(s)) return Promise.resolve();
  const f=cupFills(s,S.matches); if(!f.length) return Promise.resolve();
  return call('api_fillKnockout',s.id,f).then(r=>{S.session=r.session;S.matches=sortM(r.matches);render();toast('Đã điền đội vào vòng loại trực tiếp');}).catch(()=>{});
}
function bkBox(m,title){
  if(!m) return '';
  const s=S.session, done=!!m.win, A=sideNames(m,'a'), B=sideNames(m,'b');
  const line=(n,k,sc)=>`<div class="bk-team ${done?(m.win===k?'w':'l'):''}"><span>${n[1]?esc(n[0])+' – '+esc(n[1]):`<em class="ph">${esc(n[0])}</em>`}</span><b>${done?sc:''}</b></div>`;
  return `<button class="bk-box ${done?'done':''}" data-act="score" data-id="${m.id}"><small>${title} · ${roundTime(s,m)}${s.courts>1?' · '+esc(courtShort(s,m.court)):''}</small>${line(A,'A',m.sa)}${line(B,'B',m.sb)}</button>`;
}
function bracketHTML(){
  const ms=S.matches, g=st=>ms.find(m=>m.stage===st), F=g('F');
  const champ=F&&F.win?(F.win==='A'?F.a:F.b):null;
  return `<div class="bracket glass">
    <div class="bk-grid">
      <div class="bk-col">${bkBox(g('SF1'),'Bán kết 1')}${bkBox(g('SF2'),'Bán kết 2')}</div>
      <div class="bk-join" aria-hidden="true"><i></i></div>
      <div class="bk-col mid">${bkBox(F,'Chung kết')}
        <div class="champ ${champ?'on':''}"><span class="ms fill">emoji_events</span><div><small>Vô địch</small><b>${champ?esc(champ.join(' – ')):'Chờ chung kết'}</b></div></div></div>
    </div>
    <div class="bk-third">${bkBox(g('3RD'),'Tranh hạng 3')}</div>
  </div>`;
}
function groupTable(g,rows){
  return `<div class="tbl-wrap glass grp"><table><thead><tr><th>Bảng ${g}</th><th>Tr</th><th>T</th><th>B</th><th>HS</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${i<2?'q':''}"><td><span class="gpos">${i+1}</span><b>${esc(r.team.p.join(' – '))}</b>${r.team.seed?`<span class="seed">HG${r.team.seed}</span>`:''}</td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.diff>0?'+':''}${r.diff}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function viewCup(){
  const cups=S.boot.sessions.filter(isCup);
  const head=`<div class="sec-row"><h3>Giải đấu mini · ${cups.length}</h3><button class="btn filled sm" data-act="newCup"><span class="ms">add</span>Tạo giải</button></div>`;
  if(!cups.length) return head+`<div class="empty glass"><span class="ms">emoji_events</span><h2>Chưa có giải nào</h2><div class="sub">Chia 2 bảng có hạt giống, đánh vòng tròn, rồi bán kết chéo, tranh hạng 3 và chung kết. Tiền thua, tiền sân tính như buổi thường.</div><button class="btn filled" data-act="newCup"><span class="ms">add</span>Tạo giải đấu</button></div>`;
  const s=S.session;
  if(!isCup(s)) return head+`<div class="empty glass"><span class="ms">hourglass_top</span><b>Đang mở giải…</b></div>`;
  const ms=S.matches, st=cupStandings(s,ms), done=ms.filter(m=>m.win).length;
  const stageList=['A','B','SF1','SF2','3RD','F'].map(k=>[k,ms.filter(m=>m.stage===k)]).filter(x=>x[1].length);
  return head+`
  ${cups.length>1?`<div class="chips">${cups.map(c=>`<button class="chip ${c.id===s.id?'on':''}" data-act="openCup" data-id="${c.id}">${esc(c.cup?.name||'Giải')} · ${shortDate(c.date)}</button>`).join('')}</div>`:''}
  <section class="hero glass cup-hero">
    <div class="hero-top"><div style="min-width:0"><div class="eyebrow">Giải đấu mini · ${dayLabel(s.date)}</div><h1>${esc(s.cup?.name||'Giải đấu')}</h1>
      <div class="sub">${(s.cup?.teams||[]).length} đội · 2 bảng · ${s.start}–${addMin(s.start,s.duration)} · thua ${kmoney(s.fee)}/người</div></div>
      <span class="status ${s.status}">${s.status==='CHOT'?'Đã chốt':'Đang đấu'}</span></div>
    <div class="progress"><i style="width:${ms.length?Math.round(done*100/ms.length):0}%"></i></div>
    <div class="hero-meta"><span><b>${done}/${ms.length}</b> trận có tỷ số</span><span>Đội đi tiếp: nhất & nhì mỗi bảng</span></div>
    <div class="row-actions"><button class="btn tonal sm" data-act="shareSchedule"><span class="ms">ios_share</span>Gửi lịch</button>
      <button class="btn outline sm" data-act="tab" data-tab="summary"><span class="ms">payments</span>Tiền buổi này</button></div>
  </section>
  <h3>Sơ đồ loại trực tiếp</h3>${bracketHTML()}
  <h3>Vòng bảng</h3><div class="grp-wrap">${groupTable('A',st.A)}${groupTable('B',st.B)}</div>
  ${stageList.map(([k,arr])=>`<h3>${STAGE_NAME[k]} · ${arr.filter(m=>m.win).length}/${arr.length}</h3><div class="rows glass">${arr.map(m=>matchRow(m,'',null)).join('')}</div>`).join('')}`;
}

/* ---------- sao kê công nợ từng người (ai cũng xem được) ---------- */
function openStatement(name){
  const st=S.boot.settings.startDate, all=(S.boot.ledgerAll||S.boot.ledger).filter(l=>l.type==='THU'&&l.person===name);
  // bỏ khoản trước ngày mở sổ trừ nợ đầu kỳ (đã gom vào "Nợ đầu kỳ")
  const off=new Set(S.boot.ledger.map(l=>l.id)), rows=all.filter(l=>off.has(l.id)&&!isDep(l)).sort((a,b)=>(a.date+noteKey(a.note)).localeCompare(b.date+noteKey(b.note)));
  const total=rows.reduce((t,l)=>t+l.amount,0), paid=rows.filter(l=>l.status==='DA_DONG').reduce((t,l)=>t+l.amount,0);
  const desc=l=>{
    if(l.sessionId==='DK') return `Nợ đầu kỳ · ${esc(l.note||'nợ cũ')}`;
    if(String(l.sessionId).startsWith('QT-')) return `Quỹ tháng ${monthLabel(l.sessionId)}`;
    const s=S.boot.sessions.find(x=>x.id===l.sessionId), tag=s&&isCup(s)?` (${esc(s.cup?.name||'giải')})`:'';
    if(l.category==='Tiền thua') return `Buổi ${shortDate(l.date)}${tag} · tiền thua trận${s&&s.fee&&l.amount%s.fee===0&&l.amount>0?' ('+Math.round(l.amount/s.fee)+' × '+kmoney(s.fee)+')':''}`;
    if(l.category==='Chia sân/nước') return `Buổi ${shortDate(l.date)}${tag} · chia tiền sân/nước`;
    return esc(l.category)+(l.note?' · '+esc(l.note):'');
  };
  let run=0;
  openSheet(`<div class="sh-head"><div style="display:flex;gap:12px;align-items:center">${avatar(name,44)}<div><h2>${esc(name)}</h2><div class="sub">Sao kê công nợ${st?` từ ${shortDate(st)}`:''} · app tự ghi, chủ hội quản lý</div></div></div><button class="icon-btn" data-act="closeSheet" aria-label="Đóng"><span class="ms">close</span></button></div>
    <div class="stats"><div class="stat glass"><small>Tổng phát sinh</small><b>${kmoney(total)}</b></div><div class="stat glass"><small>Đã trả</small><b class="pos">${kmoney(paid)}</b></div><div class="stat glass"><small>Còn nợ</small><b class="${total-paid>0?'neg':'pos'}">${total-paid?kmoney(total-paid):'0đ'}</b></div></div>
    ${rows.length?`<div class="stmt">${rows.map(l=>{run+=l.status==='DA_DONG'?0:l.amount;return `<div class="st-row">
      <span class="st-date">${shortDate(l.date)}</span>
      <div class="pname">${desc(l)}<small>${l.status==='DA_DONG'?`<span class="pos">✓ Đã trả</span> · ${atLabel(l.at)}${l.by?' · '+esc(l.by):''}`:'<span class="neg">Chưa trả</span>'}</small></div>
      <b class="${l.amount<0?'pos':''}">${kmoney(l.amount)}</b></div>`;}).join('')}</div>`:'<div class="sub">Chưa có khoản nào.</div>'}
    ${creditsOf()[name]?`<div class="calc"><span>💳 Tiền gửi trước còn: <b class="pos">${money(creditsOf()[name])}</b> – tự trừ vào khoản nợ mới</span></div>`:''}
    <div class="sub">Số âm là tiền đang dư. Khoản ghi “trừ tiền gửi trước” là đã trả bằng tiền gửi. Có sai sót thì báo chủ hội ${esc(ownerName())} để chỉnh trong sổ.</div>
    <button class="btn tonal" data-act="copyStmt" data-name="${esc(name)}"><span class="ms">content_copy</span>Sao chép sao kê</button>`);
  openStatement.text=()=>[`📄 Sao kê ${name}`,...rows.map(l=>`${shortDate(l.date)} ${desc(l).replace(/<[^>]+>/g,'')}: ${kmoney(l.amount)} ${l.status==='DA_DONG'?'✓':'(chưa trả)'}`),`Còn nợ: ${money(total-paid)}`].join('\n');
}

/** Vẽ ảnh 1080px rộng bằng canvas (màu sân, đội thắng xanh, đội thua mờ). */
async function drawShot(kind){
  try{ await document.fonts.ready; }catch(e){}
  const F='"Be Vietnam Pro",system-ui,sans-serif', W=1080, P=48, s=S.session, st=S.boot.settings;
  const club=String(st.clubName||'Hội Pick').toUpperCase();
  // ---- dựng danh sách khối để tính chiều cao trước ----

  if(kind==='schedule'){
    const x=pd(s.date); blocks.push({t:'head',title:isCup(s)?String(s.cup?.name||'GIẢI ĐẤU').toUpperCase():club,
      sub:`${DOWU[x.getDay()]} · ${shortDate(s.date)} · ${s.start}–${addMin(s.start,s.duration)}`,
      info:`${s.players.length} người · ${s.courts} sân · ${S.matches.length} trận${(s.freeSlots||[]).length?` + ${s.freeSlots.length} lượt đánh vui`:''}${s.fee?` · thua ${kmoney(s.fee)}/người`:' · đánh vui'}`});
    if(s.courts>1) blocks.push({t:'legend'});
    let last=''; schedItems(s,S.matches).forEach(m=>{const tm=roundTime(s,m); if(tm!==last){blocks.push({t:'time',v:tm});last=tm;} blocks.push({t:m.free?'free':'match',m});});
    blocks.push({t:'foot',v:'📝 Nhập tỷ số trên app Sổ Pick'});
  } else if(kind==='result'){
    const rows=perPlayer(s,S.matches).sort((a,b)=>b.w-a.w||a.l-b.l||a.name.localeCompare(b.name));
    const mm=s.status==='CHOT'?sessionMoney(s.id):previewMoney(s,S.matches);
    blocks.push({t:'head',title:'KẾT QUẢ · '+shortDate(s.date),sub:club,info:s.status==='CHOT'?'✅ Đã chốt sổ':`⏳ Tạm tính · ${S.matches.filter(m=>m.win).length}/${S.matches.length} trận có tỷ số`});
    blocks.push({t:'thead',cols:['#','Người chơi','Thắng–Thua','Phải đóng']});
    let tot=0; rows.forEach((r,i)=>{const m=mm[r.name]||{lose:0,share:0};tot+=m.lose+m.share;blocks.push({t:'prow',i,r,m});});
    extraOf(s).forEach((n,j)=>{const m=mm[n]||{lose:0,share:0};tot+=m.lose+m.share;blocks.push({t:'prow',i:rows.length+j,r:{name:n,w:0,l:0,extra:1},m});});
    blocks.push({t:'total',v:`TỔNG: ${money(tot)}`});
    if(s.status==='CHOT'&&st.acc) blocks.push({t:vietQR(0,'PICK')?'bankqr':'bank'});
  } else {
    const D=debtsOf(S.boot.ledger); if(!D.length) throw new Error('Không ai nợ quỹ');
    blocks.push({t:'head',title:'CÔNG NỢ · '+shortDate(todayStr()),sub:club,info:`${D.length} người còn nợ`});
    D.forEach((d,i)=>blocks.push({t:'drow',i,d}));
    blocks.push({t:'total',v:`TỔNG NỢ: ${money(D.reduce((t,d)=>t+d.sum,0))}`});
    if(st.acc) blocks.push({t:vietQR(0,'PICK')?'bankqr':'bank'});
  }

/* ---------- Tin nhắn gửi Zalo: ngắn, dễ đọc ---------- */
const DOWU=['CHỦ NHẬT','THỨ 2','THỨ 3','THỨ 4','THỨ 5','THỨ 6','THỨ 7'];
const tcase=n=>String(n||'').toLowerCase().split(' ').map(w=>w?w[0].toLocaleUpperCase('vi')+w.slice(1):w).join(' ');
const pad2=n=>String(n).padStart(2,'0');
/** Link gửi Zalo: bản mobile → link GitHub đang mở (mở nhanh); bản web → link …/exec trong Cài đặt. */
const appLink=()=>IS_API?location.origin+location.pathname:(S.boot.settings.appUrl||(IS_GAS?'':location.href.split('#')[0]));
function schedText(){
  const s=S.session, x=pd(s.date), club=String(S.boot.settings.clubName||'Hội Pick').toUpperCase(), multi=s.courts>1;
  const pair=k=>sideNames({...k.m},k.side).filter(Boolean).map(tcase).join(' – ');
  const head=isCup(s)?`🏆 ${String(s.cup?.name||'GIẢI ĐẤU').toUpperCase()}`:`🏓 ${club}`;
  const lines=[head,`${DOWU[x.getDay()]} · ${shortDate(s.date)} · ${s.start}`,
    `${s.players.length} người · ${s.courts} sân · ${S.matches.some(m=>m.win)?`${S.matches.filter(m=>m.win).length}/${S.matches.length} trận đã đánh`:`Dự kiến ${S.matches.length} trận`}`,
    ...(extraOf(s).length?[`🎲 Đánh vui: ${extraOf(s).map(tcase).join(', ')}${(s.freeSlots||[]).length?` (${s.freeSlots.length} lượt sân tự cặp)`:''}`]:[]),
    ...(multi?[Array.from({length:s.courts},(_,i)=>`${cEmo(i+1)} ${courtName(s,i+1)}`).join('   ')]:[]),
    '📍 LỊCH THI ĐẤU'];
  let last='';
  schedItems(s,S.matches).forEach(m=>{ const t=roundTime(s,m); if(t!==last){lines.push(t);last=t;}
    if(m.free){ lines.push(`${multi?cEmo(m.court)+' ':''}🎲 Đánh vui${multi?' · '+courtName(s,m.court):''} — tự cặp`); return; }
    const A=pair({m,side:'a'}),B=pair({m,side:'b'});
    const tg=[m.kind==='DON'?'Đơn':m.kind==='MIX'?'Mix':'',m.mode==='GL'?'Giao lưu':(m.fee!=null&&+m.fee!==+s.fee?kmoney(+m.fee):'')].filter(Boolean).join(', ');
    lines.push(`${multi?cEmo(m.court)+' ':''}#${pad2(m.no)}${multi?' · '+courtName(s,m.court):''}${m.stage?' · '+STAGE_SHORT[m.stage]:''} — ${A} vs ${B}${tg?` [${tg}]`:''}${m.win?` (${m.sa}-${m.sb})`:''}`); });
  const l=appLink(); lines.push(`📝 Nhập tỷ số: ${l||'[link web app của hội]'}`);
  return lines.join('\n');
}
function resultText(){
  const s=S.session, rows=perPlayer(s,S.matches).sort((a,b)=>b.w-a.w||a.l-b.l||a.name.localeCompare(b.name));
  const mm=s.status==='CHOT'?sessionMoney(s.id):previewMoney(s,S.matches), w=Math.max(...rows.map(r=>r.name.length),4);
  const st=s.status==='CHOT'?'✅ Đã chốt sổ':`⏳ Tạm tính – chưa chốt (${S.matches.filter(m=>m.win).length}/${S.matches.length} trận có tỷ số)`;
  const lines=[`🏆 KẾT QUẢ BUỔI PICK · ${shortDate(s.date)}`,st,''];
  let tot=0;
  rows.forEach(r=>{ const m=mm[r.name]||{lose:0,share:0}, v=m.lose+m.share; tot+=v;
    const md=r.w?['🥇','🥈','🥉'][rows.indexOf(r)]||'▫️':'▫️';
    lines.push(`${md} ${r.name.padEnd(w)}  ${r.w}T – ${r.l}B | ${v?kmoney(v):'0đ'}${m.share?` (sân ${kmoney(m.share)})`:''}`); });
  extraOf(s).forEach(n=>{const m=mm[n]||{lose:0,share:0},v=m.lose+m.share;tot+=v;lines.push(`▫️ ${n.padEnd(w)}  chỉ góp sân | ${v?kmoney(v):'0đ'}`);});
  lines.push('',`TỔNG: ${money(tot)}${s.fee?'':' · buổi đánh vui'}`);
  const b=bankBlock(); if(b&&tot&&s.status==='CHOT'){ lines.push('',b); const qu=qrUrl('',0); if(qu) lines.push(`📷 Mã QR: ${qu}`); }
  return lines.join('\n');
}

  openMonthly:t=>openMonthly(t&&t.dataset&&t.dataset.m),
  moTap(t){const O=openMonthly.O,n=t.dataset.name; // chưa ĐK → ĐK chưa đóng → đã đóng → bỏ
    if(!O.reg.has(n)) O.reg.add(n); else if(!O.paid.has(n)) O.paid.add(n); else { O.reg.delete(n); O.paid.delete(n); }
    O.refresh();},
  moAllPaid(){const O=openMonthly.O;[...O.reg].forEach(n=>O.paid.add(n));O.refresh();},
  moNav(t){openMonthly(shiftMonth(openMonthly.O.month,+t.dataset.d));},
  moAll(t){const O=openMonthly.O,on=t.dataset.v==='1',vis=[...document.querySelectorAll('#moList [data-name]')].filter(e=>!e.hidden).map(e=>e.dataset.name);
    vis.forEach(n=>{ if(on)O.reg.add(n); else {O.reg.delete(n);O.paid.delete(n);} });
    O.refresh();},
  moFlag(){const O=openMonthly.O,prev=monthRegs(shiftMonth(O.month,-1));if(!prev){toast('Tháng trước chưa có ai đăng ký tháng');return;}O.reg.clear();prev.forEach(n=>O.reg.add(n));[...O.paid].forEach(n=>{if(!O.reg.has(n))O.paid.delete(n);});O.refresh();},
  memMonthly(t){memSet(t.dataset.id,'monthly',t);},
  memAll(t){const k=t.dataset.k,on=t.dataset.v==='1';document.querySelectorAll(`#memList .mem:not([hidden]) [data-act="${k==='monthly'?'memMonthly':'memToggle'}"]`).forEach(b=>{if((b.dataset.on==='1')!==on)memSet(b.dataset.id,k,b);});},
  memSave(){const ch=Object.entries(openSettings.CH||{}).map(([id,v])=>({id,...v}));if(!ch.length)return;
    needPin().then(pin=>call('api_saveMembers',ch,pin,ensureMe())).then(b=>{S.boot=b;openSettings.CH={};const y=$('#sheetBody').scrollTop;openSettings();$('#sheetBody').scrollTop=y;render();toast('Đã lưu '+ch.length+' thành viên');}).catch(fail);},
  forgetPin(){store.set('sopick_pin',null);S.pin=null;openSettings();toast('Đã quên PIN trên máy này');},
  player(t){openPlayer(t.dataset.name);},
  shareOn(t){const C=openClose.C;C.enabled=!C.enabled;t.classList.toggle('on',C.enabled);openClose.upd(true);},
  shareMode(t){const C=openClose.C,r=C.rules[t.dataset.name];r.mode=t.dataset.mode;if(r.mode==='fixed'&&(!+r.amount||+r.amount===50000))r.amount=lastVL();openClose.upd(true);},
  cntAdj(t){t.classList.toggle('on');},
  openCount:()=>openCount(),
  rankP(t){S.rankP=t.dataset.v;store.set('sopick_rankp',S.rankP);render();},
  rankT(t){S.rankT=t.dataset.v;render();},
  shareRank:()=>shareRank(),
  markPaid(t){needPin().then(pin=>call('api_setPaid',t.dataset.ids.split(','),true,pin,ensureMe())).then(b=>{S.boot=b;render();toast('Đã thu tiền '+t.dataset.name);}).catch(fail);},
  togglePaid(t){needPin().then(pin=>call('api_setPaid',[t.dataset.id],t.dataset.paid==='1',pin,ensureMe())).then(b=>{S.boot=b;closeSheet();render();}).catch(fail);},
  delLedger(t){const l=(S.boot.ledgerAll||S.boot.ledger).find(x=>x.id===t.dataset.id);
    if(l&&isDep(l)){const used=(S.boot.ledgerAll||S.boot.ledger).filter(x=>x.sessionId==='GT'&&x.category==='Trừ tiền gửi'&&x.person===l.person);
      if(!confirm(`Xóa khoản "${l.category}" ${money(Math.abs(l.amount))} của ${l.person}?\n\n${used.length?`${used.length} khoản nợ đã trừ bằng tiền gửi (${money(-used.reduce((a,x)=>a+x.amount,0))}) sẽ trở lại CHƯA TRẢ. Nếu ${l.person} còn khoản gửi khác, app sẽ trừ lại bằng số đó.`:'Chưa có khoản nợ nào bị trừ bằng tiền gửi này.'}`))return;}
    needPin().then(pin=>call('api_deleteLedger',t.dataset.id,pin,ensureMe())).then(b=>{S.boot=b;closeSheet();render();toast('Đã xóa');}).catch(fail);},
  ledger(t){openLedger(t.dataset.id);},
  lgMode(t){S.lgMode=t.dataset.v;S.lgN=40;render();},
  lgMore(){S.lgN=(S.lgN||40)+40;render();},
  lgGroup(t){openPayGroup(t.dataset.ids.split(','));},
  ownDet(){S.ownDet=!S.ownDet;render();},
  fDet(t){openFundDetail(t.dataset.k);},
  lType(t){document.querySelectorAll('#lType button').forEach(b=>b.classList.toggle('on',b===t));},
  openSession(t){loadSession(t.dataset.id).then(()=>{S.tab='matches';render();window.scrollTo({top:0});});},
  pickSession(){const ss=S.boot?.sessions||[];openSheet(`<div class="sh-head"><h2>Chọn buổi</h2><button class="icon-btn" data-act="closeSheet" aria-label="Đóng"><span class="ms">close</span></button></div>
    <div class="legend" style="margin-bottom:6px"><span class="status MO">Sắp đánh</span><span class="status LIVE">Đang đánh</span><span class="status PAST">Chưa chốt</span><span class="status CHOT">Đã chốt</span></div>
    <div>${(()=>{ let lastM=''; return ss.map(s=>{ const m=s.date.slice(0,7), st=sessState(s);
      const hd=m!==lastM?`<div class="mon-head" style="border-left:6px solid ${monColor(s.date)}">Tháng ${monthLabel(m)} · ${ss.filter(z=>z.date.slice(0,7)===m).length} buổi</div>`:''; lastM=m;
      return hd+`<button class="srow ${s.id===S.sid?'cur':''}" data-act="openSession" data-id="${s.id}">${dateBox(s)}<div class="pname">${s.players.length} người · ${s.doneCount}/${s.matchCount} trận<small>${stTag(s)} ${s.start}${s.courts>1?` · ${s.courts} sân`:''}${s.id===S.sid?' · <b>đang xem</b>':''}</small></div><span class="status ${st.k}">${st.t}</span></button>`; }).join(''); })()||'<div class="sub">Chưa có buổi nào</div>'}</div>
    <button class="btn filled" data-act="newSession"><span class="ms">add</span>Tạo buổi mới</button>`);},
  settings:()=>openSettings(),
  theme(t){store.set('sopick_theme',t.dataset.v||null);applyTheme();document.querySelectorAll('#sTheme button').forEach(b=>b.classList.toggle('on',b===t));},
  memToggle(t){memSet(t.dataset.id,'active',t);},
  memFemale(t){memSet(t.dataset.id,'female',t);},
  memAdd(){const v=$('#sNew').value.trim();if(!v)return;needPin().then(pin=>call('api_addMember',v,pin,ensureMe())).then(b=>{S.boot=b;openSettings();toast('Đã thêm '+v.toUpperCase());}).catch(fail);},
  demoReset(){Mock.reset();S.allMatches=null;S.amKey='';closeSheet();boot();toast('Đã khôi phục dữ liệu mẫu');},
  ...CreateActs, ...EditActs, ...MatchActs
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=ACT[t.dataset.act]; if(!a) return;
  if(t.tagName==='BUTTON'||t.tagName==='A') e.preventDefault();
  a(t,e);
});
document.addEventListener('change',e=>{ if(e.target.dataset&&e.target.dataset.lgwho!==undefined){ S.lgWho=e.target.value; S.lgN=40; render(); }
  if(e.target.dataset&&e.target.dataset.lgmon!==undefined){ S.lgMon=e.target.value; S.lgN=40; render(); } });
document.addEventListener('input',e=>{ if(e.target.id==='q'){ S.q=e.target.value; renderList(); }
  if(e.target.dataset&&e.target.dataset.cn!==undefined&&openCreate.F){ openCreate.F.courtNames[+e.target.dataset.cn]=e.target.value.trim()||('Sân '+(+e.target.dataset.cn+1)); }
  if(e.target.dataset&&e.target.dataset.filter){ const q=fold(e.target.value); document.querySelectorAll(e.target.dataset.filter+' [data-name]').forEach(el=>el.hidden=!!q&&!fold(el.dataset.name).includes(q)); }
  if(e.target.dataset&&e.target.dataset.fx&&openClose.C){ openClose.C.rules[e.target.dataset.fx].amount=parseInt(e.target.value.replace(/\D/g,''),10)||0; openClose.upd(false); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheetOpen()) closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); } });

/* ====================== TẢI DỮ LIỆU ====================== */
function refreshBoot(){ return call('api_bootstrap').then(b=>{S.boot=b;render();}); }
const sortM=ms=>ms.sort((a,b)=>(a.round-b.round)||(a.court-b.court)||(a.no-b.no));
function loadSession(id){
  return call('api_getMatches',id).then(r=>{S.sid=id;store.set('sopick_sid',id);S.session=r.session;S.matches=sortM(r.matches);if(sheetOpen())closeSheet();render();cupAutoFill();});
}
function pickDefault(){
  const ss=S.boot.sessions;
  const target=ss.find(s=>s.id===S.sid)||ss.find(s=>s.status==='MO')||ss[0];
  if(target) return loadSession(target.id);
  S.session=null;S.matches=[];render();return Promise.resolve();
}
/* Bản mobile: lưu bản sao dữ liệu trên máy → mở app hiện ngay, rồi cập nhật ngầm */
const CACHE_KEY='sopick_cache_v1';
function saveCache(){ if(!IS_API||!S.boot) return; try{ const b={...S.boot,ledger:S.boot.ledgerAll||S.boot.ledger}; delete b.ledgerAll;
  store.set(CACHE_KEY,JSON.stringify({boot:b,current:S.session?{session:S.session,matches:S.matches.map(({saving,...m})=>m)}:null,at:Date.now()})); }catch(e){} }
function bootApi(){
  let hadCache=false;
  try{ const c=JSON.parse(store.get(CACHE_KEY)||'null'); if(c&&c.boot&&c.boot.settings){ S.boot=prepBoot(c.boot); S.ver='cache';
      if(c.current&&c.current.session){ S.session=c.current.session; S.matches=sortM(c.current.matches); S.sid=S.session.id; }
      hadCache=true; render(); } }catch(e){}
  return call('api_open',S.sid||'').then(r=>{ S.boot=prepBoot(r.boot); S.ver=r.ver;
      if(r.current){ S.session=r.current.session; S.matches=sortM(r.current.matches); S.sid=S.session.id; S.mver=r.current.mver; store.set('sopick_sid',S.sid); }
      if(!sheetOpen()) render(); cupAutoFill(); saveCache(); })
    .catch(e=>{ if(hadCache){ toast('Đang xem dữ liệu lưu trên máy · '+e.message); return; } showApiError(e); });
}
/** Kiểm tra máy chủ bằng …/exec?ping=1 dạng JSONP (không bị chặn CORS) → biết lỗi do link, quyền truy cập hay do mạng. */
function pingApi(){ return new Promise(res=>{ const cb='__sp'+Date.now(), sc=document.createElement('script'); let fin=false;
  const done=r=>{ if(fin) return; fin=true; clearTimeout(t); try{delete window[cb];}catch(e){} sc.remove(); res(r); };
  const t=setTimeout(()=>done('timeout'),12000); window[cb]=j=>done(j&&j.ok?(j.api?'ok':'old'):'bad');
  sc.onerror=()=>done('error'); sc.onload=()=>setTimeout(()=>done('bad'),50);
  sc.src=API_URL+(API_URL.includes('?')?'&':'?')+'ping=1&cb='+cb; document.head.appendChild(sc); }); }
function showApiError(e){
  const short=API_URL.replace(/^https:\/\/script\.google\.com\/macros\/(u\/\d+\/)?s\//,'…/s/');
  const box=(diag)=>`<div class="empty glass" style="text-align:left;align-items:stretch"><div style="text-align:center"><span class="ms">wifi_off</span><b style="display:block">Không tải được dữ liệu</b><div class="sub">${esc(e.message)}</div></div>
    <div class="sub">Link máy chủ đang dùng:<br><span class="mono">${esc(short)}</span></div>${diag}
    <div class="row-actions" style="justify-content:center"><button class="btn filled" onclick="boot()"><span class="ms">refresh</span>Thử lại</button><button class="btn outline" onclick="changeApi()"><span class="ms">edit</span>Đổi link máy chủ</button></div></div>`;
  $('#view').innerHTML=box('<div class="hint">Đang kiểm tra máy chủ…</div>');
  pingApi().then(r=>{ const D={
    ok:'<div class="hint ok">Máy chủ Apps Script <b>chạy bình thường</b>. Lỗi do mạng hoặc trình duyệt chặn (tiện ích chặn quảng cáo, chế độ tiết kiệm dữ liệu…). Thử tắt tiện ích chặn, mở bằng Chrome/Safari khác hoặc đổi Wi-Fi/4G rồi bấm Thử lại.</div>',
    old:'<div class="hint warn">Máy chủ chạy nhưng là <b>Code.gs cũ</b> (chưa có cổng cho bản mobile). Dán Code.gs mới vào Apps Script → Triển khai → Quản lý triển khai → sửa → <b>Phiên bản mới</b>.</div>',
    def:`<div class="hint bad"><b>Không gọi được máy chủ.</b> Kiểm tra lần lượt:<br>
      1. <b>Link đúng chưa?</b> Apps Script → Triển khai → Quản lý triển khai → copy “URL ứng dụng web” (đuôi /exec) → bấm <b>Đổi link máy chủ</b> và dán vào.<br>
      2. <b>Quyền truy cập</b> phải là <b>Bất kỳ ai</b> (không phải “Bất kỳ ai có tài khoản Google”).<br>
      3. Đã dán <b>Code.gs mới</b> và triển khai <b>phiên bản mới</b> chưa.<br>
      Thử nhanh: mở <span class="mono">${esc(API_URL)}?ping=1</span> trên trình duyệt – thấy chữ <b>"ok":true</b> là máy chủ đã đúng.</div>`};
    $('#view').innerHTML=box(D[r]||D.def); });
}
function changeApi(){
  const v=(prompt('Dán link web app Apps Script (đuôi /exec):',API_URL)||'').trim(); if(!v) return;
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){ alert('Link phải bắt đầu bằng https://script.google.com/ và kết thúc bằng /exec'); return; }
  store.set('sopick_api',v.replace(/\/u\/\d+\/s\//,'/s/')); store.set('sopick_api_base',window.SOPICK_FILE_API||''); store.set(CACHE_KEY,null); location.reload();
}
function boot(){
  if(IS_API) return bootApi();
  const B=window.__BOOT__; window.__BOOT__=null;
  if(B&&B.settings){ // dữ liệu đã nhúng sẵn trong trang (bản Apps Script) → hiện ngay
    S.boot=prepBoot(B); S.ver=B.ver; S.mver=B.current&&B.current.mver;
    if(B.current&&(!S.sid||S.sid===B.current.session.id||!B.sessions.some(s=>s.id===S.sid))){ S.session=B.current.session;S.matches=sortM(B.current.matches);S.sid=S.session.id;render();cupAutoFill();return Promise.resolve(); }
    return pickDefault();
  }
  return call('api_bootstrap').then(b=>{S.boot=b;return pickDefault();}).catch(e=>{ $('#view').innerHTML=`<div class="empty glass"><span class="ms">wifi_off</span><b>Không tải được dữ liệu</b><div class="sub">${esc(e.message)}</div><button class="btn filled" onclick="boot()">Thử lại</button></div>`; }); }

// Tự làm mới (10 giây/lần khi đang mở tab Trận/Tổng kết, ngay khi quay lại app) – chỉ tải phần đã đổi
function poll(){
  if(document.hidden||sheetOpen()||!['matches','summary'].includes(S.tab)||!S.session||S.session.status!=='MO'||pending) return;
  call('api_poll',S.session.id,S.ver||'',S.mver||'').then(r=>{
    if(r.same||!r.current) return; // không đổi → không tải gì
    if(r.boot) S.boot=prepBoot(r.boot);
    if(r.current.session.id!==(S.session&&S.session.id)) return;
    sortM(r.current.matches); const changed=JSON.stringify(r.current.matches)!==JSON.stringify(S.matches.map(({saving,...m})=>m));
    S.session=r.current.session; if(r.current.mver) S.mver=r.current.mver;
    // giữ trận mình vừa ghi mà server chưa kịp trả về
    const mine={}; S.matches.filter(m=>m.saving).forEach(m=>mine[m.id]=m);
    S.matches=r.current.matches.map(m=>mine[m.id]||m);
    saveCache();
    if(changed){ S.amStale=true; if(!sheetOpen()){ const y=window.scrollY; if(document.activeElement&&document.activeElement.id==='q') renderList(); else render(); window.scrollTo({top:y}); } }
  }).catch(()=>{});
}
setInterval(poll,8000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) setTimeout(poll,300); else saveCache(); });
window.addEventListener('pagehide',saveCache);
window.addEventListener('focus',()=>setTimeout(poll,300));

applyTheme();
render();
boot();
// Nếu bộ biểu tượng rút gọn không tải được thì tải bộ đầy đủ
setTimeout(()=>{try{ if(document.fonts&&!document.fonts.check('24px "Material Symbols Rounded"')){ const l=document.createElement('link'); l.rel='stylesheet'; l.href='https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&display=swap'; document.head.appendChild(l);} }catch(e){}},4000);
window.__SOPICK_END__='SOPICK_EOF'; // dòng cuối của app – thiếu dòng này là file bị dán thiếu
</script>

  navigator.serviceWorker.addEventListener('message',e=>{ if(e.data!=='sopick-update'||document.getElementById('updBar')) return;
    const d=document.createElement('button'); d.id='updBar'; d.textContent='✨ Có bản mới – chạm để cập nhật';
    d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:99;padding:12px 18px;border-radius:999px;border:0;background:#00696C;color:#fff;font:700 14px system-ui;box-shadow:0 8px 24px rgba(0,0,0,.25)';
    d.onclick=()=>location.reload(); document.body.appendChild(d); }); }</script>
