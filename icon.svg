<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1BB3A6"/><stop offset=".55" stop-color="#007A7C"/><stop offset="1" stop-color="#003F44"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".22" r=".7"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFEDE9"/></linearGradient>
    <radialGradient id="ball" cx=".34" cy=".3" r=".85"><stop offset="0" stop-color="#F8FFB8"/><stop offset=".5" stop-color="#DCF24E"/><stop offset="1" stop-color="#9DB514"/></radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#002629" flood-opacity=".45"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- vạch sân -->
  <path d="M48 448 L464 448" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="10" stroke-linecap="round"/>
  <!-- vợt -->
  <g filter="url(#sh)" transform="translate(256 262) rotate(35) scale(.93) translate(-256 -246)">
    <rect x="232" y="292" width="48" height="138" rx="16" fill="#0B2A2D"/>
    <rect x="232" y="308" width="48" height="10" fill="#DCF24E"/>
    <rect x="232" y="328" width="48" height="6" fill="#DCF24E" opacity=".7"/>
    <rect x="232" y="404" width="48" height="26" rx="12" fill="#14403F"/>
    <rect x="150" y="62" width="212" height="244" rx="98" fill="url(#face)"/>
    <rect x="150" y="62" width="212" height="244" rx="98" fill="none" stroke="#0B2A2D" stroke-width="12"/>
    <path d="M200 120 Q256 96 312 120" stroke="#007A7C" stroke-opacity=".22" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <!-- bóng -->
  <g filter="url(#sh)">
    <circle cx="372" cy="146" r="62" fill="url(#ball)"/>
    <g fill="#6F8500" opacity=".75">
      <circle cx="349" cy="114" r="8"/><circle cx="380" cy="106" r="8"/><circle cx="407" cy="130" r="8"/>
      <circle cx="363" cy="143" r="8"/><circle cx="394" cy="162" r="8"/><circle cx="340" cy="164" r="8"/>
      <circle cx="370" cy="183" r="8"/><circle cx="410" cy="182" r="7"/>
    </g>
  </g>
  <!-- vệt bóng bay -->
  <path d="M300 214 Q330 196 336 186" stroke="#DCF24E" stroke-opacity=".55" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
